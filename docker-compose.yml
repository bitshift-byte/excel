version: "3.8"

services:
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile.auth
    container_name: lx-auth-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - ./data:/app/data
    environment:
      - AUTH_CONFIG_PATH=/app/data/auth_config.json
      - AUTH_CORS_ORIGINS=*
      - PASSWORD_SALT=excel-merger-salt
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
