version: "3.8"
services:
  web:
    build: .
    container_name: lx-web
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./output:/app/output
    environment:
      - SERVICE_TOKEN=lx-internal-service-token
      - PASSWORD_SALT=excel-merger-salt
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
