<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>处理结果 - LX捞数据</title>
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="/static/style.css">
<style>
.mail-wrap{max-width:1000px;margin:0 auto;padding:24px}
.page-title{font-family:var(--font-display);font-size:20px;font-weight:700;color:var(--text);margin-bottom:16px;display:flex;align-items:center;gap:10px}
.page-title svg{width:22px;height:22px;color:var(--primary)}

.action-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.action-bar .spacer{flex:1}

.date-group{margin-bottom:10px}
.date-group-head{cursor:pointer;display:flex;align-items:center;gap:8px;padding:9px 14px;background:var(--muted);border-radius:var(--r-sm);user-select:none;transition:background .15s}
.date-group-head:hover{background:var(--muted-2)}
.date-group-head .chevron{transition:transform .2s;color:var(--text-4);width:14px;height:14px;flex-shrink:0}
.date-group-head.collapsed .chevron{transform:rotate(-90deg)}
.date-group-head .dg-title{font-weight:700;font-size:13px;color:var(--primary)}
.date-group-body{overflow:hidden}
.date-group-body.hidden{display:none}
.table-scroll{max-height:340px;overflow-y:auto;border:1px solid var(--border-l);border-radius:0 0 var(--r-sm) var(--r-sm)}

.log-box{font-family:monospace;font-size:12px;line-height:1.8;max-height:260px;overflow-y:auto;background:var(--muted);border-radius:var(--r-sm);padding:12px;color:var(--text-2)}
.section-desc{font-size:12px;color:var(--text-4);margin-top:2px}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="logo"><svg><use href="#i-database"/></svg></div>
      <div>
        <div class="name">LX捞数据</div>
        <div class="sub">LX捞数据</div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section">
        <div class="nav-section-title">功能</div>
        <div class="nav-item" onclick="window.location.href='/'"><svg><use href="#i-upload"/></svg> 文件合并</div>
        <div class="nav-item" onclick="window.location.href='/mail'"><svg><use href="#i-mail"/></svg> 邮件设置</div>
        <div class="nav-item active" onclick="window.location.href='/mail/results'"><svg><use href="#i-download"/></svg> 处理结果</div>
      </div>
    </nav>
    <div class="sidebar-footer">
      <div class="user-box" id="userBox" style="display:none">
        <div class="user-avatar" id="userAvatar"></div>
        <div class="user-info">
          <div class="user-name" id="userName">用户</div>
          <div class="user-role" id="userRole">角色</div>
        </div>
        <button class="btn-logout" onclick="doLogout()" title="退出登录"><svg><use href="#i-log-out"/></svg></button>
      </div>
      <div class="status"><span class="dot"></span>服务运行中</div>
    </div>
  </aside>

  <div class="main">
    <div class="mail-wrap">
      <div class="page-title"><svg><use href="#i-download"/></svg> 处理结果</div>

      <div class="card card-pad" style="margin-bottom:20px">
        <div class="action-bar admin-only">
          <span class="badge badge-accent badge-hidden" id="mailStatusRunning">● 运行中</span>
          <span class="badge badge-amber" id="mailStatusStopped">○ 已停止</span>
          <div class="spacer"></div>
          <button class="btn btn-ghost" style="padding:7px 16px;font-size:13px" onclick="startMail()">启动轮询</button>
          <button class="btn btn-ghost" style="padding:7px 16px;font-size:13px" onclick="stopMail()">停止轮询</button>
          <button class="btn btn-primary btn-lg" onclick="openRunModal()"><svg style="width:16px;height:16px"><use href="#i-zap"/></svg> 立即执行</button>
        </div>
      </div>

      <div class="card" style="margin-bottom:20px">
        <div class="card-head">
          <div class="ch-icon"><svg><use href="#i-download"/></svg></div>
          <div>
            <div class="ch-title">处理结果</div>
            <div class="section-desc">合并生成的 Excel，按日期分组</div>
          </div>
          <div class="ch-spacer"></div>
          <button class="btn btn-ghost" style="padding:5px 12px;font-size:12px" onclick="loadMailResults()">刷新</button>
        </div>
        <div class="card-pad" style="padding-top:14px">
          <div id="mailResults"></div>
        </div>
      </div>

      <div class="card" style="margin-bottom:20px">
        <div class="card-head">
          <div class="ch-icon"><svg><use href="#i-mail"/></svg></div>
          <div>
            <div class="ch-title">捞取任务</div>
            <div class="section-desc">每轮捞到的邮件及附件，按日期分组</div>
          </div>
          <div class="ch-spacer"></div>
          <button class="btn btn-ghost" style="padding:5px 12px;font-size:12px" onclick="loadMailTasks()">刷新</button>
        </div>
        <div class="card-pad" style="padding-top:14px">
          <div id="mailTasks"></div>
        </div>
      </div>

      <div class="card">
        <div class="card-head" style="cursor:pointer" onclick="toggleLog()">
          <div class="ch-icon"><svg><use href="#i-refresh"/></svg></div>
          <div>
            <div class="ch-title">处理日志</div>
            <div class="section-desc">最近轮询的详细记录（点击展开/收起）</div>
          </div>
          <div class="ch-spacer"></div>
          <button class="btn btn-ghost" style="padding:5px 12px;font-size:12px" onclick="event.stopPropagation();loadMailLogs()">刷新</button>
          <svg id="logChevron" style="width:16px;height:16px;color:var(--text-4);transition:transform .2s"><use href="#i-chevron-right"/></svg>
        </div>
        <div class="card-pad hidden" id="logBody" style="padding-top:14px">
          <div class="log-box" id="mailLogs"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <symbol id="i-database" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></symbol>
  <symbol id="i-chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></symbol>
  <symbol id="i-log-out" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></symbol>
  <symbol id="i-mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></symbol>
  <symbol id="i-zap" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></symbol>
</svg>

<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-box">
    <div class="spinner"></div>
    <p id="loadingText">正在处理中...</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="runModal" onclick="if(event.target===this)closeRunModal()">
  <div class="modal-box">
    <h3>选择处理日期</h3>
    <div class="modal-content">
      <p>选择要处理的邮件日期，会捞取该日期一整天的邮件并合并。</p>
      <input type="date" id="runDate" class="rule-form-input" style="margin-top:12px;padding:10px 14px">
    </div>
    <div style="display:flex;gap:10px;margin-top:20px">
      <button class="btn btn-ghost" style="flex:1" onclick="closeRunModal()">取消</button>
      <button class="btn btn-primary" style="flex:1" onclick="confirmRun()">立即执行</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="previewModal" onclick="if(event.target===this)closePreview()">
  <div class="modal-box" style="max-width:900px">
    <h3 style="display:flex;align-items:center;gap:8px"><svg style="width:18px;height:18px;color:var(--primary)"><use href="#i-file"/></svg> <span id="previewFilename">预览</span></h3>
    <div id="previewContent" style="margin-top:12px"></div>
    <button class="btn btn-ghost" style="margin-top:16px;width:100%" onclick="closePreview()">关闭</button>
  </div>
</div>

<script>
function esc(s){if(s===null||s===undefined)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function toast(msg,type){const t=document.getElementById('toast');const icon=type==='error'?'<svg><use href="#i-alert"/></svg>':'<svg><use href="#i-check"/></svg>';t.innerHTML=icon+msg;t.className='toast show '+(type||'success');setTimeout(()=>t.classList.remove('show'),3000)}
function showLoading(text){document.getElementById('loadingText').textContent=text||'处理中...';document.getElementById('loadingOverlay').classList.add('show')}
function hideLoading(){document.getElementById('loadingOverlay').classList.remove('show')}

function toggleDateGroup(head){
  head.classList.toggle('collapsed');
  head.parentElement.querySelector('.date-group-body').classList.toggle('hidden');
}
function toggleLog(){
  const body=document.getElementById('logBody');
  body.classList.toggle('hidden');
  document.getElementById('logChevron').style.transform=body.classList.contains('hidden')?'rotate(0)':'rotate(90deg)';
}

function renderDateGroups(containerId, byDate, renderRow){
  const el=document.getElementById(containerId);
  const dates=Object.keys(byDate).sort().reverse();
  if(dates.length===0){el.innerHTML='<div style="color:var(--text-4);font-size:13px;padding:8px 0">暂无数据</div>';return}
  let html='';
  dates.forEach((date,i)=>{
    const rows=byDate[date];
    const collapsed=i>0;
    html+='<div class="date-group">';
    html+='<div class="date-group-head'+(collapsed?' collapsed':'')+'" onclick="toggleDateGroup(this)">';
    html+='<svg class="chevron"><use href="#i-chevron-right"/></svg>';
    html+='<span class="dg-title">'+esc(date)+'</span>';
    html+='<span class="badge badge-primary">'+rows.length+' 条</span>';
    html+='</div>';
    html+='<div class="date-group-body'+(collapsed?' hidden':'')+'"><div class="table-scroll">';
    html+=renderRow(rows);
    html+='</div></div></div>';
  });
  el.innerHTML=html;
}

function updateMailStatus(running){
  document.getElementById('mailStatusRunning').classList.toggle('badge-hidden',!running);
  document.getElementById('mailStatusStopped').classList.toggle('badge-hidden',running);
}
async function apiFetch(url, opts){
  const resp=await fetch(url, opts);
  if(!resp.ok){
    let detail='HTTP '+resp.status;
    try{const e=await resp.json();detail=e.detail||detail}catch(_){}
    return {status:'error', detail:detail};
  }
  return await resp.json();
}
async function loadMailStatus(){
  try{const d=await apiFetch('/api/mail/status');if(d.status==='success')updateMailStatus(d.running)}catch(e){}
}
async function startMail(){
  showLoading('正在启动...');
  try{const d=await apiFetch('/api/mail/start',{method:'POST'});if(d.status==='success'){updateMailStatus(d.running);toast(d.running?'已启动轮询':'启动失败')}else{toast('启动失败: '+(d.detail||'未知错误'),'error')}}catch(e){toast('请求出错: '+e.message,'error')}finally{hideLoading()}
}
async function stopMail(){
  showLoading('正在停止...');
  try{const d=await apiFetch('/api/mail/stop',{method:'POST'});if(d.status==='success'){updateMailStatus(d.running);toast('已停止轮询')}else{toast('停止失败: '+(d.detail||'未知错误'),'error')}}catch(e){toast('请求出错: '+e.message,'error')}finally{hideLoading()}
}
async function runMailOnce(date){
  showLoading('正在立即执行，可能需要几十秒...');
  try{
    const d=await apiFetch('/api/mail/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({date:date||''})});
    if(d.status==='success'){toast('执行完成，处理 '+d.handled+' 封邮件');loadMailLogs();loadMailResults();loadMailTasks();}
    else toast('执行失败: '+(d.detail||'未知错误'),'error');
  }catch(e){toast('请求出错: '+e.message,'error')}finally{hideLoading()}
}
function openRunModal(){
  const today=new Date().toISOString().split('T')[0];
  document.getElementById('runDate').value=today;
  document.getElementById('runModal').classList.add('show');
}
function closeRunModal(){
  document.getElementById('runModal').classList.remove('show');
}
function confirmRun(){
  const date=document.getElementById('runDate').value;
  closeRunModal();
  runMailOnce(date);
}
function downloadFile(filename){
  if(window.pywebview && window.pywebview.api){
    window.pywebview.api.download_file(filename).then(r=>{
      if(!r) toast('已取消下载');
    }).catch(e=>toast('下载失败','error'));
  }else{
    window.location.href='/api/mail/results/'+encodeURIComponent(filename);
  }
}
async function previewResult(encFilename, filename){
  showLoading('正在加载预览...');
  try{
    const d=await apiFetch('/api/mail/results/'+encFilename+'/preview');
    if(d.status==='success'){
      document.getElementById('previewFilename').textContent=d.filename||filename;
      renderPreview(d);
      document.getElementById('previewModal').classList.add('show');
    }else toast('预览失败: '+(d.detail||'未知错误'),'error');
  }catch(e){toast('请求出错','error')}
  finally{hideLoading()}
}
function renderPreview(d){
  const sheets=d.sheets||[];
  let tabs='<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">';
  sheets.forEach((s,i)=>{
    tabs+='<button class="btn '+(i===0?'btn-primary':'btn-ghost')+'" style="padding:4px 12px;font-size:12px" id="ptab-'+i+'" onclick="switchPreviewSheet('+i+')">'+esc(s.sheet_name)+' <span style="opacity:.7">('+s.total_rows+'行)</span></button>';
  });
  tabs+='</div>';
  let bodies='';
  sheets.forEach((s,i)=>{
    const headers=s.rows[0]||[];
    let t='<div id="psheet-'+i+'" style="'+(i===0?'':'display:none')+'">';
    t+='<div style="max-height:480px;overflow:auto;border:1px solid var(--border-l);border-radius:var(--r-sm)">';
    t+='<table class="ptbl"><thead><tr>';
    headers.forEach(h=>t+='<th>'+esc(h)+'</th>');
    t+='</tr></thead><tbody>';
    s.rows.slice(1).forEach(row=>{
      t+='<tr>';
      row.forEach(c=>t+='<td title="'+esc(c)+'">'+esc(c)+'</td>');
      t+='</tr>';
    });
    t+='</tbody></table></div>';
    if(s.total_rows>21)t+='<div style="font-size:11px;color:var(--text-4);margin-top:4px">仅预览前 20 行，共 '+s.total_rows+' 行</div>';
    t+='</div>';
    bodies+=t;
  });
  document.getElementById('previewContent').innerHTML=tabs+bodies;
}
function switchPreviewSheet(i){
  document.querySelectorAll('[id^="psheet-"]').forEach(el=>el.style.display='none');
  document.getElementById('psheet-'+i).style.display='';
  document.querySelectorAll('[id^="ptab-"]').forEach(el=>el.className=el.className.replace('btn-primary','btn-ghost'));
  const tab=document.getElementById('ptab-'+i);
  if(tab)tab.className=tab.className.replace('btn-ghost','btn-primary');
}
function closePreview(){
  document.getElementById('previewModal').classList.remove('show');
}

async function loadMailLogs(){
  try{
    const d=await apiFetch('/api/mail/logs');
    if(d.status==='success'){
      const logs=d.logs||[];
      const el=document.getElementById('mailLogs');
      el.innerHTML=logs.length>0?logs.map(l=>'<div>'+esc(l)+'</div>').join(''):'<div style="color:var(--text-4)">暂无日志</div>';
      el.scrollTop=el.scrollHeight;
    }
  }catch(e){}
}
async function loadMailResults(){
  try{
    const d=await apiFetch('/api/mail/results');
    if(d.status==='success'){
      const byDate={};
      (d.files||[]).forEach(f=>{const date=(f.mtime||'').split(' ')[0]||'未知日期';if(!byDate[date])byDate[date]=[];byDate[date].push(f)});
      renderDateGroups('mailResults',byDate,rows=>{
        let h='<table class="rtbl"><thead><tr><th>文件名</th><th style="width:70px">时间</th><th style="width:70px">大小</th><th style="width:140px">操作</th></tr></thead><tbody>';
        rows.forEach(f=>{
          const enc=encodeURIComponent(f.filename);
          h+='<tr><td>'+esc(f.filename)+'</td><td style="color:var(--text-4)">'+esc((f.mtime||'').split(' ')[1]||'')+'</td><td style="color:var(--text-4)">'+(f.size/1024).toFixed(1)+'KB</td>'+
            '<td style="white-space:nowrap">'+
            '<button class="btn btn-ghost" style="padding:3px 10px;font-size:12px" onclick="previewResult(\''+enc+'\',\''+esc(f.filename)+'\')">预览</button> '+
            '<button class="btn btn-ghost" style="padding:3px 10px;font-size:12px" data-filename="'+esc(f.filename)+'" onclick="downloadFile(this.dataset.filename)">下载</button>'+
            '</td></tr>';
        });
        return h+'</tbody></table>';
      });
    }
  }catch(e){}
}
async function loadMailTasks(){
  try{
    const d=await apiFetch('/api/mail/tasks');
    if(d.status==='success'){
      const byDate={};
      (d.tasks||[]).forEach(t=>{
        const dt=t.time||'';const date=dt.split(' ')[0]||'未知日期';const time=dt.split(' ')[1]||'';
        (t.mails||[]).forEach(m=>{if(!byDate[date])byDate[date]=[];byDate[date].push({time,subject:m.subject||'',attachments:(m.attachments||[]).join('、'),processed:m.processed})});
      });
      renderDateGroups('mailTasks',byDate,rows=>{
        let h='<table class="rtbl"><thead><tr><th style="width:70px">时间</th><th>邮件主题</th><th>附件</th><th style="width:80px">状态</th></tr></thead><tbody>';
        rows.forEach(r=>{
          h+='<tr><td style="color:var(--text-4)">'+esc(r.time)+'</td><td>'+esc(r.subject)+'</td><td style="color:var(--text-4)">'+esc(r.attachments)+'</td>'+
            '<td><span class="badge '+(r.processed?'badge-accent':'badge-amber')+'">'+(r.processed?'已处理':'跳过')+'</span></td></tr>';
        });
        return h+'</tbody></table>';
      });
    }
  }catch(e){}
}

async function loadUserInfo(){
  try{
    const resp=await fetch('/api/me');
    if(!resp.ok){window.location.href='/login';return}
    const d=await resp.json();
    if(d.status==='success'&&d.user){
      const u=d.user;
      document.getElementById('userName').textContent=u.name||u.username;
      document.getElementById('userRole').textContent=u.role==='admin'?'管理员':'普通用户';
      document.getElementById('userAvatar').textContent=(u.name||u.username||'?')[0].toUpperCase();
      document.getElementById('userBox').style.display='flex';
      if(u.role!=='admin'){
        const mailNav=document.querySelector('.nav-item[onclick="window.location.href=\'/mail\'"]');
        if(mailNav)mailNav.style.display='none';
        document.querySelectorAll('.admin-only').forEach(function(el){el.style.display='none'});
      }
    }
  }catch(e){window.location.href='/login'}
}
async function doLogout(){
  try{await fetch('/api/logout',{method:'POST'})}catch(e){}
  window.location.href='/login';
}

loadUserInfo();
loadMailStatus();
loadMailLogs();
loadMailResults();
loadMailTasks();
</script>
</body>
</html>
