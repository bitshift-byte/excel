<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LX捞数据 · 管理后台</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#F06595;--primary-d:#D6336C;--primary-l:#FF8FB1;--primary-bg:#FFF0F5;
  --secondary:#9B7DD4;--secondary-d:#7B5BC4;--secondary-l:#C9A0E8;--secondary-bg:#F5F0FA;
  --accent:#3DD4A6;--accent-d:#22B888;--accent-l:#5DEBBD;--accent-bg:#EBFBF5;
  --amber:#F6A609;--amber-bg:#FFF9E6;
  --danger:#E64980;--danger-bg:#FFF0F6;
  --bg:#FDF6F0;--surface:#FFFFFF;--muted:#FBF2EE;--muted-2:#F5E8E2;
  --text:#3D2B3C;--text-2:#5C4555;--text-3:#8B7588;--text-4:#B0A0AD;
  --border:#F0DEE7;--border-l:#F8E8EF;
  --shadow-sm:0 1px 3px rgba(61,43,60,.04);
  --shadow-md:0 4px 8px -2px rgba(240,101,149,.06),0 2px 4px -1px rgba(61,43,60,.03);
  --shadow-lg:0 8px 24px -6px rgba(240,101,149,.15),0 2px 8px -2px rgba(61,43,60,.04);
  --shadow-xl:0 16px 40px -8px rgba(240,101,149,.2),0 4px 12px -4px rgba(61,43,60,.05);
  --shadow-pink:0 8px 24px -6px rgba(240,101,149,.32);
  --r-xl:24px;--r-lg:20px;--r-md:14px;--r-sm:10px;--r-pill:999px;
  --glass-bg:rgba(255,255,255,.72);--glass-border:rgba(255,255,255,.6);--glass-blur:blur(16px);
  --grad-sakura:linear-gradient(135deg,#F06595,#FF8FB1);
  --grad-warm:linear-gradient(135deg,#FFF0F5,#F5F0FA);
  --ease-spring:cubic-bezier(.22,1,.36,1);--dur:.28s;
  --font-display:'Quicksand',-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;
  --font-body:'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
*::-webkit-scrollbar{width:6px;height:6px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:#E8C5D4;border-radius:3px}
*::-webkit-scrollbar-thumb:hover{background:#D6336C}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);font-size:14px;line-height:1.65;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
h1,h2,h3{font-family:var(--font-display)}
@keyframes blossom-in{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
@keyframes float-orb{0%,100%{transform:translate(0,0)}50%{transform:translate(20px,-30px)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============ Login View ============ */
#loginView{min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.bg-deco{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bg-deco .orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.35;animation:float-orb 8s ease-in-out infinite}
.bg-deco .s1{width:420px;height:420px;background:var(--primary-l);top:-80px;left:-60px}
.bg-deco .s2{width:360px;height:360px;background:var(--secondary-l);bottom:-60px;right:-40px;animation-delay:2s}
.bg-deco .s3{width:280px;height:280px;background:#A8C5E8;top:40%;right:20%;animation-delay:4s;opacity:.2}
.login-wrap{position:relative;z-index:1;width:100%;max-width:420px;padding:20px}
.login-card{background:var(--glass-bg);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border:1px solid var(--glass-border);border-radius:var(--r-xl);box-shadow:var(--shadow-xl);padding:40px 36px;animation:blossom-in .5s var(--ease-spring) both}
.logo-area{display:flex;align-items:center;gap:12px;margin-bottom:32px}
.logo-area .logo{width:46px;height:46px;border-radius:var(--r-md);background:var(--grad-sakura);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-pink);color:#fff;font-family:var(--font-display);font-size:20px;font-weight:700}
.logo-area .title{font-family:var(--font-display);font-size:19px;font-weight:700;color:var(--primary-d);letter-spacing:-.3px}
.logo-area .sub{font-size:12px;color:var(--text-4);font-weight:500}
.form-group{margin-bottom:20px}
.form-label{display:block;font-size:13px;font-weight:700;color:var(--text-2);margin-bottom:6px;font-family:var(--font-display)}
.form-input{width:100%;padding:12px 14px 12px 40px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);font-size:14px;color:var(--text);transition:all var(--dur) var(--ease-spring);font-family:inherit}
.form-input::placeholder{color:var(--text-4)}
.form-input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-bg)}
.input-wrap{position:relative}
.input-wrap svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--text-4)}
.input-wrap:focus-within svg{color:var(--primary)}
.err-msg{display:none;align-items:center;gap:8px;background:var(--danger-bg);color:var(--danger);border:1px solid rgba(230,73,128,.15);border-radius:var(--r-sm);padding:10px 14px;font-size:13px;margin-bottom:20px;font-weight:600}
.err-msg.show{display:flex;animation:blossom-in .3s var(--ease-spring)}
.err-msg svg{width:16px;height:16px;flex-shrink:0}
.btn-login{width:100%;padding:13px;border:none;border-radius:var(--r-pill);background:var(--grad-sakura);color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:all var(--dur) var(--ease-spring);display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-body);box-shadow:0 6px 20px rgba(240,101,149,.3)}
.btn-login:hover{box-shadow:0 10px 28px rgba(240,101,149,.4);transform:translateY(-2px)}
.btn-login:active{transform:translateY(0)}
.btn-login:disabled{opacity:.6;cursor:not-allowed;transform:none}
.btn-login .spin{display:none;width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
.btn-login.loading .spin{display:block}
.btn-login.loading .btn-text{display:none}

/* ============ Dashboard View ============ */
#dashView{display:none;min-height:100vh}
.topbar{height:62px;background:var(--glass-bg);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border-bottom:1px solid var(--glass-border);display:flex;align-items:center;padding:0 32px;gap:16px;position:sticky;top:0;z-index:100}
.topbar .tb-logo{width:36px;height:36px;border-radius:var(--r-sm);background:var(--grad-sakura);display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-display);font-size:16px;font-weight:700;box-shadow:var(--shadow-pink)}
.topbar .tb-title{font-family:var(--font-display);font-size:18px;font-weight:700;color:var(--text)}
.topbar .tb-spacer{flex:1}
.topbar .tb-user{display:flex;align-items:center;gap:10px}
.tb-avatar{width:34px;height:34px;border-radius:var(--r-sm);background:var(--grad-sakura);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;font-family:var(--font-display);box-shadow:0 2px 8px rgba(240,101,149,.25)}
.tb-name{font-size:13px;font-weight:700;color:var(--text)}
.tb-role{font-size:11px;color:var(--text-4);font-weight:600}
.btn-logout{flex-shrink:0;background:none;border:1px solid var(--border);border-radius:var(--r-sm);padding:7px 14px;cursor:pointer;color:var(--text-3);transition:all var(--dur) var(--ease-spring);font-size:13px;font-weight:600;font-family:var(--font-body);display:flex;align-items:center;gap:6px}
.btn-logout:hover{background:var(--danger-bg);border-color:var(--danger);color:var(--danger)}
.btn-logout svg{width:16px;height:16px}
.content{padding:32px;max-width:1100px;margin:0 auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px;margin-bottom:24px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:16px 20px;transition:all var(--dur) var(--ease-spring);animation:blossom-in .4s var(--ease-spring) both}
.stat:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.stat-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-4);font-family:var(--font-display)}
.stat-value{font-family:var(--font-display);font-size:28px;font-weight:700;color:var(--primary-d);margin-top:2px}
.stat-value.accent{color:var(--accent-d)}
.stat-value.amber{color:var(--amber)}
.stat-value.secondary{color:var(--secondary-d)}
.action-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.action-bar h2{font-size:17px;font-weight:700;color:var(--text)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 18px;border:1px solid var(--border);border-radius:var(--r-sm);font-size:13px;font-weight:700;font-family:var(--font-body);cursor:pointer;transition:all var(--dur) var(--ease-spring);background:var(--surface);color:var(--text-2)}
.btn:hover{border-color:var(--primary-l);color:var(--primary-d)}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--grad-sakura);color:#fff;border:none;box-shadow:0 4px 12px rgba(240,101,149,.25)}
.btn-primary:hover{box-shadow:var(--shadow-pink);transform:translateY(-1px);color:#fff}
.btn-sm{padding:6px 12px;font-size:12px;gap:4px}
.btn-danger{background:var(--danger-bg);border-color:transparent;color:var(--danger)}
.btn-danger:hover{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important}

/* ============ User Table ============ */
.table-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-sm)}
table{width:100%;border-collapse:collapse}
thead th{padding:12px 16px;text-align:left;font-family:var(--font-display);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-4);background:var(--muted);border-bottom:1px solid var(--border-l);white-space:nowrap}
tbody td{padding:12px 16px;border-bottom:1px solid var(--border-l);font-size:13px;color:var(--text-2)}
tbody tr{transition:background var(--dur) var(--ease-spring)}
tbody tr:hover{background:var(--primary-bg)}
tbody tr:last-child td{border-bottom:none}
.cell-user{display:flex;align-items:center;gap:10px}
.cell-avatar{width:34px;height:34px;border-radius:var(--r-sm);background:var(--grad-warm);color:var(--primary-d);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;font-family:var(--font-display);flex-shrink:0;border:1px solid var(--border)}
.cell-username{font-weight:700;color:var(--text)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 10px;border-radius:var(--r-pill);font-family:var(--font-display)}
.badge-admin{background:var(--secondary-bg);color:var(--secondary-d)}
.badge-user{background:var(--accent-bg);color:var(--accent-d)}
.cell-actions{display:flex;align-items:center;gap:6px}
.empty-row{text-align:center;padding:40px;color:var(--text-4)}

/* ============ Toggle Switch ============ */
.toggle{position:relative;display:inline-block;width:42px;height:24px;cursor:pointer}
.toggle input{opacity:0;width:0;height:0}
.toggle .slider{position:absolute;inset:0;background:var(--muted-2);border-radius:var(--r-pill);transition:var(--dur) var(--ease-spring)}
.toggle .slider::before{content:'';position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:var(--dur) var(--ease-spring);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.toggle input:checked+.slider{background:var(--accent)}
.toggle input:checked+.slider::before{transform:translateX(18px)}
.toggle.disabled{opacity:.4;cursor:not-allowed}

/* ============ Modal ============ */
.modal-overlay{position:fixed;inset:0;background:rgba(61,43,60,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:999;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex;animation:fade-in .2s}
.modal-box{background:var(--glass-bg);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border:1px solid var(--glass-border);border-radius:var(--r-xl);max-width:460px;width:100%;padding:32px;box-shadow:var(--shadow-xl);animation:blossom-in .3s var(--ease-spring)}
.modal-box h3{font-family:var(--font-display);font-size:18px;margin-bottom:20px;display:flex;align-items:center;gap:8px;color:var(--text)}
.modal-box h3 svg{width:20px;height:20px;color:var(--primary)}
.modal-field{margin-bottom:16px}
.modal-field label{display:block;font-size:13px;font-weight:700;color:var(--text-2);margin-bottom:6px;font-family:var(--font-display)}
.modal-field input,.modal-field select{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:var(--r-sm);font-size:14px;color:var(--text);background:var(--surface);font-family:inherit;transition:all var(--dur) var(--ease-spring)}
.modal-field input:focus,.modal-field select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-bg)}
.modal-field select{cursor:pointer}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:24px}
.modal-toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--muted);border-radius:var(--r-sm);margin-bottom:16px}
.modal-toggle-row label{font-size:13px;font-weight:700;color:var(--text-2);font-family:var(--font-display)}

/* ============ Toast ============ */
.toast{position:fixed;top:80px;right:32px;z-index:1000;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow-lg);padding:14px 20px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:var(--text);max-width:380px;animation:blossom-in .3s var(--ease-spring);opacity:1;transition:opacity .3s}
.toast.error{border-color:var(--danger);background:var(--danger-bg)}
.toast.success{border-color:var(--accent);background:var(--accent-bg)}
.toast svg{width:18px;height:18px;flex-shrink:0}
.toast.success svg{color:var(--accent-d)}
.toast.error svg{color:var(--danger)}

/* ============ Confirm dialog ============ */
.confirm-text{font-size:14px;color:var(--text-2);line-height:1.8;margin-bottom:8px}
.confirm-name{font-weight:700;color:var(--primary-d)}

/* ============ Tab Bar ============ */
.tab-bar{display:flex;gap:2px;background:var(--glass-bg);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border:1px solid var(--glass-border);border-radius:var(--r-md);padding:4px;margin-bottom:24px;box-shadow:var(--shadow-sm);overflow-x:auto;scroll-behavior:smooth}
.tab{display:inline-flex;align-items:center;gap:7px;padding:10px 18px;border:none;background:transparent;color:var(--text-3);font-size:13px;font-weight:700;font-family:var(--font-display);cursor:pointer;border-radius:var(--r-sm);transition:all var(--dur) var(--ease-spring);position:relative;white-space:nowrap}
.tab svg{width:16px;height:16px;flex-shrink:0}
.tab:hover{color:var(--primary-d);background:var(--primary-bg)}
.tab.active{color:var(--primary-d);background:var(--primary-bg)}
.tab.active::after{content:'';position:absolute;left:14px;right:14px;bottom:3px;height:3px;border-radius:var(--r-pill);background:var(--grad-sakura)}
.tab-panel{display:none}
.tab-panel.active{display:block;animation:fade-in .25s var(--ease-spring)}

/* ============ Config / Feature / Rule cards ============ */
.config-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:28px;box-shadow:var(--shadow-sm);max-width:680px;animation:blossom-in .4s var(--ease-spring) both}
.config-card .card-head{display:flex;align-items:center;gap:10px;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid var(--border-l)}
.config-card .card-head svg{width:22px;height:22px;color:var(--primary)}
.config-card .card-head h2{font-size:18px;font-weight:700;color:var(--text);font-family:var(--font-display)}
.cr-hint{font-size:11px;color:var(--text-4);font-weight:600;margin-left:6px}
.config-check-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--muted);border-radius:var(--r-sm);margin-bottom:20px}
.config-check-row label{font-size:14px;font-weight:700;color:var(--text-2);font-family:var(--font-display)}

.feature-row{display:flex;align-items:center;justify-content:space-between;padding:18px 0;border-bottom:1px solid var(--border-l);gap:16px}
.feature-row:last-child{border-bottom:none;padding-bottom:0}
.feature-row:first-of-type{padding-top:4px}
.feature-info .fi-title{font-size:15px;font-weight:700;color:var(--text);font-family:var(--font-display)}
.feature-info .fi-desc{font-size:12px;color:var(--text-4);margin-top:3px}

/* ============ Rule cards ============ */
.rule-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 22px;box-shadow:var(--shadow-sm);transition:all var(--dur) var(--ease-spring);margin-bottom:14px;animation:blossom-in .35s var(--ease-spring) both}
.rule-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);border-color:var(--primary-l)}
.rule-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:12px}
.rule-name{font-size:16px;font-weight:700;color:var(--text);font-family:var(--font-display);display:flex;align-items:center;gap:8px;min-width:0;word-break:break-all}
.rule-name svg{width:18px;height:18px;color:var(--primary);flex-shrink:0}
.rule-meta{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--text-3);align-items:center}
.rule-meta span{display:inline-flex;align-items:center;gap:4px}
.rule-meta svg{width:13px;height:13px;opacity:.7}
.rule-actions{display:flex;gap:6px;flex-shrink:0}
.empty-state{text-align:center;padding:50px 20px;color:var(--text-4)}
.empty-state svg{width:42px;height:42px;margin-bottom:10px;opacity:.5}

/* ============ Rule modal / headers editor ============ */
.modal-box.wide{max-width:760px;max-height:86vh;overflow-y:auto}
.headers-title-row{display:flex;align-items:center;justify-content:space-between;margin:8px 0 10px}
.headers-title-row label{font-size:13px;font-weight:700;color:var(--text-2);font-family:var(--font-display)}
.header-block{background:var(--muted);border:1px solid var(--border-l);border-radius:var(--r-md);padding:14px 16px;margin-bottom:12px}
.header-block-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.header-block-head .hb-title{font-size:13px;font-weight:700;color:var(--primary-d);font-family:var(--font-display)}
.header-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px}
.header-grid .modal-field{margin-bottom:0}
.mappings-toggle{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--secondary-d);font-weight:700;cursor:pointer;font-family:var(--font-display);user-select:none}
.mappings-toggle:hover{text-decoration:underline}
.mappings-toggle svg{width:13px;height:13px;transition:transform var(--dur) var(--ease-spring)}
.mappings-toggle.open svg{transform:rotate(180deg)}
.mapping-list{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border)}
.mapping-row{background:var(--surface);border:1px solid var(--border-l);border-radius:var(--r-sm);padding:10px 12px;margin-bottom:8px}
.mapping-row-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.mapping-row-head .mr-label{font-size:12px;font-weight:700;color:var(--text-3);font-family:var(--font-display)}
.mapping-row select{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--r-sm);font-size:13px;color:var(--text);background:var(--surface);font-family:inherit;margin-bottom:8px;cursor:pointer}
.mapping-row select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-bg)}
.span-2{grid-column:1/-1}

@media(max-width:768px){
  .content{padding:16px}
  .topbar{padding:0 16px}
  .stats{grid-template-columns:repeat(2,1fr)}
  table{font-size:12px}
  thead th,tbody td{padding:8px}
  .cell-actions{flex-wrap:wrap}
  .header-grid{grid-template-columns:1fr}
  .tab{padding:8px 12px;font-size:12px}
  .modal-box.wide{max-height:90vh}
}
</style>
</head>
<body>

<script>
var currentAdmin=null;
var users=[];
var editMode=null;
var deleteTarget=null;
var pwTarget=null;

// ====== Init ======
async function init(){
  try{
    var resp=await fetch('/admin/api/me');
    if(resp.status===200){
      var data=await resp.json();
      currentAdmin=data.user;
      showDashboard();
    }else{
      showLogin();
    }
  }catch(e){
    showLogin();
  }
}

function showLogin(){
  document.getElementById('loginView').style.display='flex';
  document.getElementById('dashView').style.display='none';
}
function showDashboard(){
  document.getElementById('loginView').style.display='none';
  document.getElementById('dashView').style.display='block';
  if(currentAdmin){
    document.getElementById('tbName').textContent=currentAdmin.name||currentAdmin.username;
    document.getElementById('tbRole').textContent=currentAdmin.role==='admin'?'管理员':'普通用户';
    document.getElementById('tbAvatar').textContent=(currentAdmin.name||currentAdmin.username||'A').charAt(0).toUpperCase();
  }
  switchTab('users');
}

// ====== Admin Login ======
async function doAdminLogin(e){
  e.preventDefault();
  var btn=document.getElementById('btnAdminLogin');
  var errEl=document.getElementById('loginErr');
  var username=document.getElementById('loginUsername').value.trim();
  var password=document.getElementById('loginPassword').value.trim();
  errEl.classList.remove('show');
  btn.classList.add('loading');
  btn.disabled=true;
  try{
    var resp=await fetch('/admin/login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username:username,password:password}),
    });
    var data=await resp.json();
    if(resp.status===200&&data.status==='success'){
      currentAdmin=data.user;
      showDashboard();
    }else{
      document.getElementById('loginErrText').textContent=data.detail||'登录失败';
      errEl.classList.add('show');
    }
  }catch(e){
    document.getElementById('loginErrText').textContent='网络错误，请重试';
    errEl.classList.add('show');
  }finally{
    btn.classList.remove('loading');
    btn.disabled=false;
  }
  return false;
}

// ====== Logout ======
async function doLogout(){
  try{await fetch('/admin/logout',{method:'POST'})}catch(e){}
  currentAdmin=null;
  users=[];
  showLogin();
}

// ====== Load Users ======
async function loadUsers(){
  try{
    var resp=await fetch('/admin/api/users');
    if(resp.status!==200){toast('加载用户列表失败','error');return}
    var data=await resp.json();
    users=data.users||[];
    renderTable();
  }catch(e){
    toast('网络错误','error');
  }
}

// ====== Render Table ======
function renderTable(){
  var tbody=document.getElementById('userTableBody');
  if(!users.length){
    tbody.innerHTML='<tr><td colspan="6" class="empty-row">暂无用户</td></tr>';
    updateStats([]);
    return;
  }
  tbody.innerHTML=users.map(function(u){
    var isSelf=currentAdmin&&u.username===currentAdmin.username;
    var avatar=(u.name||u.username||'?').charAt(0).toUpperCase();
    var roleBadge=u.role==='admin'?'<span class="badge badge-admin">管理员</span>':'<span class="badge badge-user">普通用户</span>';
    var toggleDisabled=isSelf?'disabled':'';
    var checked=u.enabled!==false?'checked':'';
    var toggleHtml='<label class="toggle'+(isSelf?' disabled':'')+'"><input type="checkbox" '+checked+' '+toggleDisabled+' onchange="toggleEnabled(\''+u.username+'\','+(u.enabled!==false)+')"><span class="slider"></span></label>';
    var actions='<div class="cell-actions">'
      +'<button class="btn btn-sm" onclick="openEditModal(\''+u.username+'\')"><svg><use href="#i-edit"/></svg></button>'
      +'<button class="btn btn-sm" onclick="openPwModal(\''+u.username+'\')"><svg><use href="#i-key"/></svg></button>'
      +(isSelf?'<button class="btn btn-sm btn-danger" disabled><svg><use href="#i-trash"/></svg></button>'
        :'<button class="btn btn-sm btn-danger" onclick="openDelModal(\''+u.username+'\')"><svg><use href="#i-trash"/></svg></button>')
      +'</div>';
    return '<tr>'
      +'<td><div class="cell-user"><div class="cell-avatar">'+avatar+'</div></div></td>'
      +'<td><span class="cell-username">'+esc(u.username)+'</span></td>'
      +'<td>'+esc(u.name||u.username)+'</td>'
      +'<td>'+roleBadge+'</td>'
      +'<td>'+toggleHtml+'</td>'
      +'<td>'+actions+'</td>'
      +'</tr>';
  }).join('');
  updateStats(users);
}

function updateStats(list){
  var total=list.length;
  var enabled=list.filter(function(u){return u.enabled!==false}).length;
  var disabled=total-enabled;
  var admins=list.filter(function(u){return u.role==='admin'}).length;
  document.getElementById('statsRow').innerHTML=[
    {label:'总用户',value:total,cls:''},
    {label:'已启用',value:enabled,cls:'accent'},
    {label:'已禁用',value:disabled,cls:'amber'},
    {label:'管理员',value:admins,cls:'secondary'},
  ].map(function(s){
    return '<div class="stat"><div class="stat-label">'+s.label+'</div><div class="stat-value '+s.cls+'">'+s.value+'</div></div>';
  }).join('');
}

// ====== Toggle Enabled ======
async function toggleEnabled(username,currentlyEnabled){
  var newEnabled=!currentlyEnabled;
  try{
    var resp=await fetch('/admin/api/users/'+encodeURIComponent(username),{
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({enabled:newEnabled}),
    });
    if(resp.status===200){
      toast('已'+(newEnabled?'启用':'禁用')+'用户 '+username,'success');
      loadUsers();
    }else{
      var data=await resp.json();
      toast(data.detail||'操作失败','error');
      loadUsers();
    }
  }catch(e){
    toast('网络错误','error');
    loadUsers();
  }
}

// ====== Add User ======
function openAddModal(){
  editMode=null;
  document.getElementById('modalTitle').innerHTML='<svg><use href="#i-user"/></svg> 添加用户';
  document.getElementById('fieldUsername').style.display='block';
  document.getElementById('fieldPassword').style.display='block';
  document.getElementById('modalEnabledRow').style.display='flex';
  document.getElementById('modalUsername').value='';
  document.getElementById('modalPassword').value='';
  document.getElementById('modalName').value='';
  document.getElementById('modalRole').value='user';

function openEditModal(username){
  var u=users.find(function(x){return x.username===username});
  if(!u)return;
  editMode=username;
  document.getElementById('modalTitle').innerHTML='<svg><use href="#i-edit"/></svg> 编辑用户';

  document.getElementById('fieldPassword').style.display='none';
  document.getElementById('modalEnabledRow').style.display='flex';
  document.getElementById('modalName').value=u.name||'';

async function submitUserForm(){
  if(editMode){
    var name=document.getElementById('modalName').value.trim();
    var role=document.getElementById('modalRole').value;
    var enabled=document.getElementById('modalEnabled').checked;
    try{
      var resp=await fetch('/admin/api/users/'+encodeURIComponent(editMode),{
        method:'PUT',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({name:name,role:role,enabled:enabled}),
      });
      if(resp.status===200){
        toast('用户信息已更新','success');
        closeModal('userModal');
        loadUsers();
      }else{
        var data=await resp.json();
        toast(data.detail||'更新失败','error');
      }
    }catch(e){
      toast('网络错误','error');
    }
  }else{
    var username=document.getElementById('modalUsername').value.trim();
    var password=document.getElementById('modalPassword').value.trim();
    var name2=document.getElementById('modalName').value.trim();
    var role2=document.getElementById('modalRole').value;
    var enabled2=document.getElementById('modalEnabled').checked;
    if(!username||!password){toast('用户名和密码不能为空','error');return}
    try{
      var resp2=await fetch('/admin/api/users',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({username:username,password:password,name:name2,role:role2,enabled:enabled2}),
      });
      if(resp2.status===201){
        toast('用户 '+username+' 已添加','success');
        closeModal('userModal');
        loadUsers();
      }else{
        var data2=await resp2.json();
        toast(data2.detail||'添加失败','error');
      }
    }catch(e){
      toast('网络错误','error');
    }
  }
}

// ====== Tab Navigation ======
var tabTitles={users:'用户管理',mail:'邮件配置',features:'功能开关',rules:'规则管理'};
function switchTab(tab){
  document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('active',t.dataset.tab===tab)});
  document.querySelectorAll('.tab-panel').forEach(function(p){p.classList.toggle('active',p.id==='panel-'+tab)});
  var titleEl=document.getElementById('tbTitle');
  if(titleEl)titleEl.textContent=tabTitles[tab]||'';
  if(tab==='users')loadUsers();
  else if(tab==='mail')loadMailConfig();
  else if(tab==='features')loadFeatures();
  else if(tab==='rules')loadRules();
}

// ====== Utils ======
function toArray(v){return Array.isArray(v)?v:(v?String(v).split(',').map(function(s){return s.trim()}).filter(Boolean):[])}
function p2(n){return n<10?'0'+n:''+n}
function formatDate(s){var d=new Date(s);if(isNaN(d.getTime()))return s||'—';return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+' '+p2(d.getHours())+':'+p2(d.getMinutes())}
function featureLabel(f){return {file_merge:'文件合并功能',mail_reader:'邮件自动读取',rule_management:'规则查看'}[f]||f}

// ====== Mail Config ======
async function loadMailConfig(){
  try{
    var resp=await fetch('/admin/api/app-config');
    if(resp.status!==200){toast('加载配置失败','error');return}
    var data=await resp.json();
    var mc=(data&&data.config&&data.config.mail_config)||(data&&data.mail_config)||{};
    document.getElementById('mcEnabled').checked=!!mc.enabled;
    document.getElementById('mcEmail').value=mc.email||'';
    document.getElementById('mcAuthCode').value=mc.auth_code||'';
    document.getElementById('mcImapHost').value=mc.imap_host||'imap.126.com';
    document.getElementById('mcKeywords').value=toArray(mc.subject_keywords).join(',');
    document.getElementById('mcProvinces').value=toArray(mc.provinces).join(',');
    document.getElementById('mcPollInterval').value=mc.poll_interval_seconds||3600;
  }catch(e){
    toast('网络错误','error');
  }
}

async function saveMailConfig(){
  var payload={
    enabled:document.getElementById('mcEnabled').checked,
    email:document.getElementById('mcEmail').value.trim(),
    auth_code:document.getElementById('mcAuthCode').value.trim(),
    imap_host:document.getElementById('mcImapHost').value.trim()||'imap.126.com',
    subject_keywords:toArray(document.getElementById('mcKeywords').value),
    provinces:toArray(document.getElementById('mcProvinces').value),
    poll_interval_seconds:parseInt(document.getElementById('mcPollInterval').value,10)||3600,
  };
  try{
    var resp=await fetch('/admin/api/mail-config',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    if(resp.status===200){toast('邮件配置已保存','success')}
    else{var d=await resp.json();toast(d.detail||'保存失败','error')}
  }catch(e){
    toast('网络错误','error');
  }
}

// ====== Features ======
async function loadFeatures(){
  try{
    var resp=await fetch('/admin/api/features');
    if(resp.status!==200){toast('加载功能开关失败','error');return}
    var data=await resp.json();
    var f=(data&&data.features)||data||{};
    document.getElementById('featFileMerge').checked=!!f.file_merge;
    document.getElementById('featMailReader').checked=!!f.mail_reader;
    document.getElementById('featRuleManagement').checked=!!f.rule_management;
  }catch(e){
    toast('网络错误','error');
  }
}

async function saveFeature(field,val){
  var payload={};payload[field]=val;
  try{
    var resp=await fetch('/admin/api/features',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    if(resp.status===200){toast((val?'已启用':'已关闭')+' '+featureLabel(field),'success')}
    else{var d=await resp.json();toast(d.detail||'保存失败','error');loadFeatures()}
  }catch(e){
    toast('网络错误','error');
    loadFeatures();
  }
}

// ====== Rules ======
var rules=[];
var ruleEditMode=null;
var ruleDelTarget=null;
var ruleHeaders=[];

async function loadRules(){
  try{
    var resp=await fetch('/admin/api/rules');
    if(resp.status!==200){toast('加载规则失败','error');return}
    var data=await resp.json();
    rules=data.rules||data||[];
    renderRules();
  }catch(e){
    toast('网络错误','error');
  }
}

function renderRules(){
  var box=document.getElementById('rulesList');
  if(!rules.length){
    box.innerHTML='<div class="empty-state"><svg><use href="#i-layers"/></svg><div>暂无规则，点击「添加规则」创建</div></div>';
    return;
  }
  box.innerHTML=rules.map(function(r){
    var cols=(r.standard_headers||[]).length;
    var updated=r.updated_at?formatDate(r.updated_at):'—';
    var rid=esc(String(r.id===undefined?'':r.id));
    return '<div class="rule-card">'
      +'<div class="rule-head">'
        +'<div class="rule-name"><svg><use href="#i-layers"/></svg>'+esc(r.name||'未命名规则')+'</div>'
        +'<div class="rule-actions">'
          +'<button class="btn btn-sm" onclick="openRuleEditModal(\''+rid+'\')"><svg><use href="#i-edit"/></svg> 编辑</button>'
          +'<button class="btn btn-sm btn-danger" onclick="openRuleDelModal(\''+rid+'\')"><svg><use href="#i-trash"/></svg> 删除</button>'
        +'</div>'
      +'</div>'
      +'<div class="rule-meta">'
        +'<span><svg><use href="#i-layers"/></svg> '+cols+' 个标准列</span>'
        +'<span>更新于 '+esc(updated)+'</span>'
        +(rid?'<span>ID: '+rid+'</span>':'')
      +'</div>'
    +'</div>';
  }).join('');
}

function openRuleAddModal(){
  ruleEditMode=null;
  document.getElementById('ruleModalTitle').innerHTML='<svg><use href="#i-layers"/></svg> 添加规则';
  document.getElementById('ruleName').value='';
  ruleHeaders=[{name:'',source_columns:'',mappings:[]}];
  renderHeaderEditor();
  openModal('ruleModal');
}

function openRuleEditModal(id){
  var r=rules.find(function(x){return String(x.id)===String(id)});
  if(!r)return;
  ruleEditMode=r.id;
  document.getElementById('ruleModalTitle').innerHTML='<svg><use href="#i-edit"/></svg> 编辑规则';
  document.getElementById('ruleName').value=r.name||'';
  ruleHeaders=(r.standard_headers||[]).map(function(h){
    return {
      name:h.name||'',
      source_columns:toArray(h.source_columns).join(','),
      mappings:(h.value_mappings||[]).map(function(m){
        if(m&&m.when_column!==undefined){
          return {type:'column',when_column:m.when_column||'',equals:m.equals||'',use_column:m.use_column||''};
        }
        return {type:'value',source_file_contains:(m&&m.source_file_contains)||'',source_value:(m&&m.source_value)||'',target_value:(m&&m.target_value)||''};
      })
    };
  });
  if(!ruleHeaders.length)ruleHeaders=[{name:'',source_columns:'',mappings:[]}];
  renderHeaderEditor();
  openModal('ruleModal');
}

function renderHeaderEditor(){
  var box=document.getElementById('headersEditor');
  if(!ruleHeaders.length){
    box.innerHTML='<div class="empty-state" style="padding:24px">尚未添加标准列，点击右上角「添加列」</div>';
    return;
  }
  box.innerHTML=ruleHeaders.map(function(h,i){
    var mappingsHtml=h.mappings.length?'<div class="mapping-list">'+h.mappings.map(function(m,mi){return renderMappingRow(i,mi,m)}).join('')+'</div>':'';
    return '<div class="header-block">'
      +'<div class="header-block-head">'
        +'<div class="hb-title">标准列 #'+(i+1)+'</div>'
        +'<button class="btn btn-sm btn-danger" onclick="removeHeader('+i+')"><svg><use href="#i-trash"/></svg></button>'
      +'</div>'
      +'<div class="header-grid">'
        +'<div class="modal-field"><label>目标列名</label><input type="text" value="'+esc(h.name)+'" onchange="updateHeader('+i+',\'name\',this.value)" placeholder="如：姓名"></div>'
        +'<div class="modal-field"><label>源列名<span class="cr-hint">逗号分隔</span></label><input type="text" value="'+esc(h.source_columns)+'" onchange="updateHeader('+i+',\'source_columns\',this.value)" placeholder="如：A列,B列"></div>'
      +'</div>'
      +'<span class="mappings-toggle'+(h.mappings.length?' open':'')+'" onclick="toggleMappings('+i+')"><svg><use href="#i-chevron"/></svg> 值映射 ('+h.mappings.length+')</span>'
      +'<div id="mappingsBox_'+i+'" style="'+(h.mappings.length?'':'display:none')+'">'
        +mappingsHtml
        +'<button class="btn btn-sm" style="margin-top:8px" onclick="addMapping('+i+')"><svg><use href="#i-plus"/></svg> 添加映射</button>'
      +'</div>'
    +'</div>';
  }).join('');
}

function renderMappingRow(hi,mi,m){
  var sel='<select onchange="updateMappingType('+hi+','+mi+',this.value)">'
    +'<option value="value"'+(m.type==='value'?' selected':'')+'>固定值映射</option>'
    +'<option value="column"'+(m.type==='column'?' selected':'')+'>条件取列</option>'
    +'</select>';
  var fields='';
  if(m.type==='column'){
    fields='<div class="header-grid">'
      +'<div class="modal-field"><label>判断列名</label><input type="text" value="'+esc(m.when_column)+'" onchange="updateMapping('+hi+','+mi+',\'when_column\',this.value)" placeholder="某列名"></div>'
      +'<div class="modal-field"><label>等于值</label><input type="text" value="'+esc(m.equals)+'" onchange="updateMapping('+hi+','+mi+',\'equals\',this.value)" placeholder="等于该值"></div>'
      +'<div class="modal-field span-2"><label>取此列的值</label><input type="text" value="'+esc(m.use_column)+'" onchange="updateMapping('+hi+','+mi+',\'use_column\',this.value)" placeholder="使用此列的值"></div>'
    +'</div>';
  }else{
    fields='<div class="header-grid">'
      +'<div class="modal-field"><label>来源文件包含</label><input type="text" value="'+esc(m.source_file_contains)+'" onchange="updateMapping('+hi+','+mi+',\'source_file_contains\',this.value)" placeholder="文件名包含"></div>'
      +'<div class="modal-field"><label>源值</label><input type="text" value="'+esc(m.source_value)+'" onchange="updateMapping('+hi+','+mi+',\'source_value\',this.value)" placeholder="原始值"></div>'
      +'<div class="modal-field span-2"><label>目标值</label><input type="text" value="'+esc(m.target_value)+'" onchange="updateMapping('+hi+','+mi+',\'target_value\',this.value)" placeholder="映射后的值"></div>'
    +'</div>';
  }
  return '<div class="mapping-row">'
    +'<div class="mapping-row-head"><span class="mr-label">映射 #'+(mi+1)+'</span><button class="btn btn-sm btn-danger" onclick="removeMapping('+hi+','+mi+')"><svg><use href="#i-trash"/></svg></button></div>'
    +sel+fields
  +'</div>';
}

function updateHeader(i,field,val){if(ruleHeaders[i])ruleHeaders[i][field]=val}
function addHeader(){ruleHeaders.push({name:'',source_columns:'',mappings:[]});renderHeaderEditor()}
function removeHeader(i){ruleHeaders.splice(i,1);renderHeaderEditor()}
function toggleMappings(i){var b=document.getElementById('mappingsBox_'+i);var t=b?b.previousElementSibling:null;if(b)b.style.display=(b.style.display==='none'?'block':'none');if(t)t.classList.toggle('open')}
function addMapping(hi){if(ruleHeaders[hi]){ruleHeaders[hi].mappings.push({type:'value',source_file_contains:'',source_value:'',target_value:''});renderHeaderEditor()}}
function removeMapping(hi,mi){if(ruleHeaders[hi]){ruleHeaders[hi].mappings.splice(mi,1);renderHeaderEditor()}}
function updateMapping(hi,mi,field,val){if(ruleHeaders[hi]&&ruleHeaders[hi].mappings[mi])ruleHeaders[hi].mappings[mi][field]=val}
function updateMappingType(hi,mi,val){if(ruleHeaders[hi]&&ruleHeaders[hi].mappings[mi]){if(val==='column'){ruleHeaders[hi].mappings[mi]={type:'column',when_column:'',equals:'',use_column:''}}else{ruleHeaders[hi].mappings[mi]={type:'value',source_file_contains:'',source_value:'',target_value:''}}renderHeaderEditor()}}

async function submitRuleForm(){
  var name=document.getElementById('ruleName').value.trim();
  if(!name){toast('规则名称不能为空','error');return}
  var standard_headers=ruleHeaders.map(function(h){
    var obj={name:h.name.trim(),source_columns:toArray(h.source_columns)};
    if(h.mappings.length){
      obj.value_mappings=h.mappings.map(function(m){
        if(m.type==='column')return {when_column:m.when_column,equals:m.equals,use_column:m.use_column};
        return {source_file_contains:m.source_file_contains,source_value:m.source_value,target_value:m.target_value};
      });
    }
    return obj;
  }).filter(function(h){return h.name});
  var payload={name:name,standard_headers:standard_headers};
  try{
    var url='/admin/api/rules'+(ruleEditMode?'/'+encodeURIComponent(ruleEditMode):'');
    var method=ruleEditMode?'PUT':'POST';
    var resp=await fetch(url,{method:method,headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    if(resp.status===200||resp.status===201){toast(ruleEditMode?'规则已更新':'规则已添加','success');closeModal('ruleModal');loadRules()}
    else{var d=await resp.json();toast(d.detail||'保存失败','error')}
  }catch(e){
    toast('网络错误','error');
  }
}

function openRuleDelModal(id){
  var r=rules.find(function(x){return String(x.id)===String(id)});
  if(!r)return;
  ruleDelTarget=r.id;
  document.getElementById('ruleDelName').textContent=r.name||'未命名';
  openModal('ruleDelModal');
}

async function confirmDeleteRule(){
  try{
    var resp=await fetch('/admin/api/rules/'+encodeURIComponent(ruleDelTarget),{method:'DELETE'});
    if(resp.status===200){toast('规则已删除','success');closeModal('ruleDelModal');loadRules()}
    else{var d=await resp.json();toast(d.detail||'删除失败','error')}
  }catch(e){
    toast('网络错误','error');
  }
}

// ====== Modal helpers ======
function openModal(id){document.getElementById(id).classList.add('show')}
function closeModal(id){document.getElementById(id).classList.remove('show')}
document.querySelectorAll('.modal-overlay').forEach(function(el){
  el.addEventListener('click',function(e){if(e.target===el)el.classList.remove('show')});
});

// ====== Toast ======
function toast(msg,type){
  var icon=type==='success'?'<use href="#i-check"/>':'<use href="#i-alert"/>';
  var el=document.createElement('div');
  el.className='toast '+(type||'');
  el.innerHTML='<svg>'+icon+'</svg><span>'+esc(msg)+'</span>';
  document.body.appendChild(el);
  setTimeout(function(){el.style.opacity='0';setTimeout(function(){el.remove()},300)},3000);
}

// ====== Utils ======
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}

// Enter key on password field
document.getElementById('loginPassword').addEventListener('keydown',function(e){
  if(e.key==='Enter'){e.preventDefault();document.getElementById('loginForm').requestSubmit()}
});

// Start
init();
