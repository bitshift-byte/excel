<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · LX捞数据</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:var(--font-body);background:var(--bg);color:var(--text);
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  -webkit-font-smoothing:antialiased;overflow-y:auto;overflow-x:hidden;
}

/* ---- Floating blossom orbs ---- */
.bg-deco{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bg-deco .orb{
  position:absolute;border-radius:50%;filter:blur(60px);opacity:.35;
  animation:float-orb 8s ease-in-out infinite;
}
.bg-deco .s1{width:420px;height:420px;background:var(--primary-l);top:-80px;left:-60px;animation-delay:0s}
.bg-deco .s2{width:360px;height:360px;background:var(--secondary-l);bottom:-60px;right:-40px;animation-delay:2s}
.bg-deco .s3{width:280px;height:280px;background:#A8C5E8;top:40%;right:20%;animation-delay:4s;opacity:.2}

/* ---- Login card (glassmorphism) ---- */
.login-wrap{position:relative;z-index:1;width:100%;max-width:420px;padding:20px}
.login-card{
  background:var(--glass-bg);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--glass-border);border-radius:var(--r-xl);
  box-shadow:var(--shadow-xl);padding:40px 36px;
  animation:blossom-in .5s var(--ease-spring) both;
}

/* ---- Logo area ---- */
.logo-area{display:flex;align-items:center;gap:12px;margin-bottom:32px}
.logo-area .logo{
  width:46px;height:46px;border-radius:var(--r-md);
  background:var(--grad-sakura);
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow-pink);
}
.logo-area .logo svg{width:22px;height:22px;color:#fff}
.logo-area .title{font-family:var(--font-display);font-size:19px;font-weight:700;color:var(--primary-d);letter-spacing:-.3px}
.logo-area .sub{font-size:12px;color:var(--text-4);font-weight:500}

/* ---- Form ---- */
.form-group{margin-bottom:20px}
.form-label{display:block;font-size:13px;font-weight:700;color:var(--text-2);margin-bottom:6px;font-family:var(--font-display)}
.form-input{
  width:100%;padding:12px 14px 12px 40px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--r-sm);
  font-size:14px;color:var(--text);transition:all var(--dur) var(--ease-soft);font-family:inherit;
}
.form-input::placeholder{color:var(--text-4)}
.form-input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-bg)}
.input-wrap{position:relative}
.input-wrap svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--text-4);transition:color var(--dur) var(--ease-soft)}
.input-wrap:focus-within svg{color:var(--primary)}

.pw-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;color:var(--text-4);background:none;border:none;padding:4px;transition:color var(--dur) var(--ease-soft)}
.pw-toggle svg{width:18px;height:18px}
.pw-toggle:hover{color:var(--text-2)}

/* ---- Error message ---- */
.err-msg{
  display:none;align-items:center;gap:8px;
  background:var(--danger-bg);color:var(--danger);
  border:1px solid rgba(230,73,128,.15);border-radius:var(--r-sm);
  padding:10px 14px;font-size:13px;margin-bottom:20px;font-weight:600;
  animation:blossom-in .3s var(--ease-spring) both;
}
.err-msg.show{display:flex}
.err-msg svg{width:16px;height:16px;flex-shrink:0}

/* ---- Login button (pill, sakura gradient) ---- */
.btn-login{
  width:100%;padding:13px;border:none;border-radius:var(--r-pill);
  background:var(--grad-sakura);color:#fff;font-size:15px;font-weight:700;
  cursor:pointer;transition:all var(--dur) var(--ease-spring);
  display:flex;align-items:center;justify-content:center;gap:8px;
  font-family:var(--font-body);
  box-shadow:0 6px 20px rgba(240,101,149,.3);
}
.btn-login:hover{box-shadow:0 10px 28px rgba(240,101,149,.4);transform:translateY(-2px)}
.btn-login:active{transform:translateY(0)}
.btn-login:disabled{opacity:.6;cursor:not-allowed;transform:none}
.btn-login svg{width:18px;height:18px}
.btn-login .spin{display:none;width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
.btn-login.loading .spin{display:block}
.btn-login.loading .btn-text{display:none}
</style>
</head>
<body>

<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <symbol id="i-database" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></symbol>
  <symbol id="i-arrow-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></symbol>
</svg>

<div class="bg-deco">
  <div class="orb s1"></div>
  <div class="orb s2"></div>
  <div class="orb s3"></div>
</div>

<div class="login-wrap">
  <div class="login-card">
    <div class="logo-area">
      <div class="logo"><svg><use href="#i-database"/></svg></div>
      <div>
        <div class="title">LX捞数据</div>
        <div class="sub">用户名密码登录</div>
      </div>
    </div>

    <div class="err-msg" id="errMsg">
      <svg><use href="#i-alert"/></svg>
      <span id="errText">用户名或密码错误</span>
    </div>

    <form id="loginForm" onsubmit="return doLogin(event)">
      <div class="form-group">
        <label class="form-label" for="username">用户名</label>
        <div class="input-wrap">
          <svg><use href="#i-user"/></svg>
          <input type="text" id="username" class="form-input" placeholder="请输入用户名" autocomplete="username" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">密码</label>
        <div class="input-wrap">
          <svg><use href="#i-lock"/></svg>
          <input type="password" id="password" class="form-input" placeholder="请输入密码" autocomplete="current-password" required style="padding-right:40px">
          <button type="button" class="pw-toggle" id="pwToggle" onclick="togglePw()">
            <svg id="eyeIcon"><use href="#i-eye"/></svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-login" id="btnLogin">
        <span class="btn-text">登录</span>
        <div class="spin"></div>
      </button>
    </form>

  </div>
</div>

<script>
function togglePw(){
  var inp=document.getElementById('password');
  var icon=document.getElementById('eyeIcon');
  if(inp.type==='password'){inp.type='text';icon.innerHTML='<use href="#i-eye-off"/>'}
  else{inp.type='password';icon.innerHTML='<use href="#i-eye"/>'}
}

async function doLogin(e){
  e.preventDefault();
  var btn=document.getElementById('btnLogin');
  var errEl=document.getElementById('errMsg');
  var username=document.getElementById('username').value.trim();
  var password=document.getElementById('password').value.trim();

  errEl.classList.remove('show');
  btn.classList.add('loading');
  btn.disabled=true;

  try{
    var resp=await fetch('/api/login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username:username,password:password}),
    });
    var data;
    try{data=await resp.json()}catch(e){data=null}
    if(data&&data.status==='success'){
      btn.disabled=true;
      window.location.href='/';
      return false;
    }
    var msg=data&&data.detail?data.detail:'登录失败';
    if(resp.status===409){
      msg='该账号已在其他设备登录。如在同一台电脑，请稍等片刻后重试；如换设备，请先在原设备退出登录。';
    }
    document.getElementById('errText').textContent=msg;
    errEl.classList.add('show');
  }catch(err){
    document.getElementById('errText').textContent='网络错误，请检查网络后重试';
    errEl.classList.add('show');
  }finally{
    btn.classList.remove('loading');
    btn.disabled=false;
  }
  return false;
}

document.getElementById('username').addEventListener('keydown',function(e){
  if(e.key==='Enter'){e.preventDefault();document.getElementById('password').focus()}
});
document.getElementById('password').addEventListener('keydown',function(e){
  if(e.key==='Enter'){e.preventDefault();document.getElementById('loginForm').requestSubmit()}
});
</script>
</body>
</html>
