<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · LX捞数据</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#1E3A5F;--primary-d:#15293F;--primary-l:#2E5A8F;--primary-bg:#EFF4F9;
  --accent:#059669;--accent-d:#047857;--accent-bg:#ECFDF5;
  --bg:#F0F4F8;--surface:#FFFFFF;
  --text:#0F172A;--text-2:#334155;--text-3:#64748B;--text-4:#94A3B8;
  --border:#E2E8F0;--border-l:#F1F5F9;
  --danger:#DC2626;--danger-bg:#FEF2F2;
  --r-xl:20px;--r-lg:16px;--r-md:12px;--r-sm:8px;
  --font-display:'Outfit',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --shadow-lg:0 10px 15px -3px rgba(0,0,0,.08),0 4px 6px -4px rgba(0,0,0,.05);
  --shadow-xl:0 20px 25px -5px rgba(0,0,0,.1),0 8px 10px -6px rgba(0,0,0,.05);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}

/* Background decoration */
.bg-deco{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bg-deco .shape{position:absolute;border-radius:50%;filter:blur(80px);opacity:.08}
.bg-deco .s1{width:480px;height:480px;background:var(--primary);top:-120px;left:-100px}
.bg-deco .s2{width:400px;height:400px;background:var(--accent);bottom:-100px;right:-80px}
.bg-deco .grid-bg{
  position:absolute;inset:0;
  background-image:linear-gradient(rgba(30,58,95,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(30,58,95,.04) 1px,transparent 1px);
  background-size:48px 48px;
  mask-image:radial-gradient(ellipse at center,black 0%,transparent 70%);
  -webkit-mask-image:radial-gradient(ellipse at center,black 0%,transparent 70%);
}

.login-wrap{position:relative;z-index:1;width:100%;max-width:440px;padding:20px}

.login-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-xl);box-shadow:var(--shadow-xl);
  padding:40px 36px;
}

/* Logo */
.logo-area{display:flex;align-items:center;gap:12px;margin-bottom:32px}
.logo-area .logo{
  width:44px;height:44px;border-radius:12px;background:var(--primary);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 12px rgba(30,58,95,.2);
}
.logo-area .logo svg{width:22px;height:22px;color:#fff}
.logo-area .title{font-family:var(--font-display);font-size:18px;font-weight:700;color:var(--primary)}
.logo-area .sub{font-size:12px;color:var(--text-4)}

/* Form */
.form-group{margin-bottom:20px}
.form-label{display:block;font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:6px}
.form-input{
  width:100%;padding:12px 14px 12px 40px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-sm);font-size:14px;color:var(--text);
  transition:all .2s;font-family:inherit;
}
.form-input::placeholder{color:var(--text-4)}
.form-input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-bg)}
.input-wrap{position:relative}
.input-wrap svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--text-4)}
.input-wrap:focus-within svg{color:var(--primary)}

/* Password toggle */
.pw-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;color:var(--text-4);background:none;border:none;padding:4px}
.pw-toggle svg{width:18px;height:18px}
.pw-toggle:hover{color:var(--text-2)}

/* Error */
.err-msg{
  display:none;align-items:center;gap:8px;
  background:var(--danger-bg);color:var(--danger);
  border:1px solid rgba(220,38,38,.15);border-radius:var(--r-sm);
  padding:10px 14px;font-size:13px;margin-bottom:20px;
}
.err-msg.show{display:flex}
.err-msg svg{width:16px;height:16px;flex-shrink:0}

/* Submit */
.btn-login{
  width:100%;padding:13px;border:none;border-radius:var(--r-sm);
  background:var(--primary);color:#fff;font-size:15px;font-weight:600;
  cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px;
  font-family:inherit;
}
.btn-login:hover{background:var(--primary-d);box-shadow:0 4px 12px rgba(30,58,95,.25);transform:translateY(-1px)}
.btn-login:disabled{opacity:.6;cursor:not-allowed;transform:none}
.btn-login svg{width:18px;height:18px}

/* Demo hint */
.demo-hint{
  margin-top:24px;padding:14px 16px;background:var(--primary-bg);
  border:1px solid rgba(30,58,95,.08);border-radius:var(--r-sm);
  font-size:12px;color:var(--text-3);line-height:1.8;
}
.demo-hint strong{color:var(--primary)}
.demo-hint .cred{display:flex;justify-content:space-between;padding:2px 0}
.demo-hint .cred code{font-family:'SF Mono',monospace;background:var(--surface);padding:1px 8px;border-radius:4px;font-size:11px;color:var(--primary);border:1px solid var(--border)}

/* Spinner */
.spin{display:none;width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn-login.loading .btn-text{display:none}
.btn-login.loading .spin{display:block}

/* Pinyin watermark */
.watermark{
  position:fixed;inset:0;z-index:0;display:flex;align-items:center;justify-content:center;
  pointer-events:none;overflow:hidden;
}
.watermark .wm-inner{
  position:relative;
  animation:wmFloat 8s ease-in-out infinite;
}
@keyframes wmFloat{
  0%,100%{transform:translateY(0) scale(1)}
  50%{transform:translateY(-16px) scale(1.03)}
}
.watermark .wm-text{
  font-family:'Outfit',sans-serif;
  font-size:clamp(200px,38vw,560px);
  font-weight:800;letter-spacing:-.05em;line-height:.8;
  color:transparent;
  -webkit-text-stroke:2px rgba(30,58,95,.07);
  user-select:none;white-space:nowrap;text-align:center;
  animation:wmStroke 6s ease-in-out infinite;
}
@keyframes wmStroke{
  0%,100%{-webkit-text-stroke-color:rgba(30,58,95,.06)}
  50%{-webkit-text-stroke-color:rgba(30,58,95,.12)}
}
.watermark .wm-text::after{
  content:'luo xia';position:absolute;inset:0;
  -webkit-text-stroke:0;
  background:linear-gradient(120deg,rgba(30,58,95,.04) 0%,rgba(5,150,105,.06) 50%,rgba(30,58,95,.04) 100%);
  background-size:200% 200%;
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:wmGradient 5s ease-in-out infinite;
}
@keyframes wmGradient{
  0%,100%{background-position:0% 50%}
  50%{background-position:100% 50%}
}
.watermark .wm-sub{
  font-family:'Outfit',sans-serif;font-size:clamp(16px,2vw,28px);
  font-weight:400;letter-spacing:1em;text-indent:1em;
  color:rgba(30,58,95,.1);margin-top:20px;text-transform:uppercase;
  animation:wmPulse 4s ease-in-out infinite;
}
@keyframes wmPulse{
  0%,100%{opacity:.6;letter-spacing:1em}
  50%{opacity:1;letter-spacing:1.4em}
}

</style>
</head>
<body>

<div class="bg-deco">
  <div class="grid-bg"></div>
  <div class="shape s1"></div>
  <div class="shape s2"></div>
</div>

<div class="watermark">
  <div class="wm-inner">
    <div class="wm-text">luo xia</div>
    <div class="wm-sub">data studio</div>
  </div>
</div>

<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <symbol id="i-database" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></symbol>
  <symbol id="i-arrow-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></symbol>
</svg>

<div class="login-wrap">
  <div class="login-card">
    <div class="logo-area">
      <div class="logo"><svg><use href="#i-database"/></svg></div>
      <div>
        <div class="title">LX捞数据</div>
        <div class="sub">LX捞数据</div>
      </div>
    </div>

    <div class="err-msg" id="errMsg">
      <svg><use href="#i-alert"/></svg>
      <span id="errText">用户名或密码错误</span>
    </div>

    <form id="loginForm" onsubmit="return doLogin(event)">
      <div class="form-group">
        <label class="form-label" for="username">用户名</label>
        <div class="input-wrap">
          <svg><use href="#i-user"/></svg>
          <input type="text" id="username" class="form-input" placeholder="请输入用户名" autocomplete="username" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">密码</label>
        <div class="input-wrap">
          <svg><use href="#i-lock"/></svg>
          <input type="password" id="password" class="form-input" placeholder="请输入密码" autocomplete="current-password" required style="padding-right:40px">
          <button type="button" class="pw-toggle" id="pwToggle" onclick="togglePw()">
            <svg id="eyeIcon"><use href="#i-eye"/></svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-login" id="btnLogin">
        <span class="btn-text">登录</span>
        <div class="spin"></div>
        <svg style="display:none" id="arrowIcon"><use href="#i-arrow-right"/></svg>
      </button>
    </form>

  </div>
</div>

<script>
function togglePw(){
  const inp=document.getElementById('password');
  const icon=document.getElementById('eyeIcon');
  if(inp.type==='password'){inp.type='text';icon.innerHTML='<use href="#i-eye-off"/>'}
  else{inp.type='password';icon.innerHTML='<use href="#i-eye"/>'}
}

async function doLogin(e){
  e.preventDefault();
  const btn=document.getElementById('btnLogin');
  const errEl=document.getElementById('errMsg');
  const username=document.getElementById('username').value.trim();
  const password=document.getElementById('password').value.trim();

  errEl.classList.remove('show');
  btn.classList.add('loading');
  btn.disabled=true;

  try{
    const resp=await fetch('/api/login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username,password}),
    });
    const data=await resp.json();
    if(data.status==='success'){
      window.location.href='/';
    }else{
      document.getElementById('errText').textContent=data.detail||'登录失败';
      errEl.classList.add('show');
    }
  }catch(err){
    document.getElementById('errText').textContent='网络错误，请重试';
    errEl.classList.add('show');
  }finally{
    btn.classList.remove('loading');
    btn.disabled=false;
  }
  return false;
}

// Enter key on username field focuses password
document.getElementById('username').addEventListener('keydown',e=>{
  if(e.key==='Enter'){e.preventDefault();document.getElementById('password').focus()}
});
</script>
</body>
</html>
