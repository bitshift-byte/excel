<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>邮件处理 - Excel 合并平台</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<style>
.mail-wrap{max-width:960px;margin:0 auto;padding:24px}
.mail-top{display:flex;align-items:center;gap:16px;padding:14px 24px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.mail-top .back{color:var(--text-3);text-decoration:none;font-size:13px;display:flex;align-items:center;gap:6px;font-weight:500}
.mail-top .back:hover{color:var(--primary)}
.mail-top .title{font-family:var(--font-display);font-size:16px;font-weight:700;color:var(--text)}
.mail-user{display:flex;align-items:center;gap:10px}
.mail-user .avatar{width:32px;height:32px;border-radius:8px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;font-family:var(--font-display)}
.mail-user .name{font-size:13px;font-weight:600;color:var(--text)}
.mail-user .role{font-size:11px;color:var(--text-4)}
.btn-logout{background:none;border:1px solid var(--border);border-radius:6px;padding:6px;cursor:pointer;color:var(--text-3);display:flex;align-items:center}
.btn-logout:hover{background:var(--danger-bg);border-color:var(--danger);color:var(--danger)}
.btn-logout svg{width:16px;height:16px}
.mail-status-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mail-status-bar .lbl{font-size:13px;font-weight:600;color:var(--text-2)}
</style>
</head>
<body>

<header class="mail-top">
  <a class="back" href="/"><svg style="width:16px;height:16px"><use href="#i-chevron-right"/></svg> 返回文件合并</a>
  <div class="title">邮件处理</div>
  <div style="flex:1"></div>
  <div class="mail-user" id="userBox" style="display:none">
    <div class="avatar" id="userAvatar"></div>
    <div><div class="name" id="userName"></div><div class="role" id="userRole"></div></div>
    <button class="btn-logout" onclick="doLogout()" title="退出登录"><svg><use href="#i-log-out"/></svg></button>
  </div>
</header>

<div class="mail-wrap">

  <div class="card card-pad" style="margin-bottom:16px">
    <div class="mail-status-bar">
      <span class="lbl">运行状态：</span>
      <span class="badge badge-accent badge-hidden" id="mailStatusRunning">● 运行中</span>
      <span class="badge badge-amber" id="mailStatusStopped">○ 已停止</span>
      <div style="flex:1"></div>
      <button class="btn btn-accent" style="padding:6px 16px;font-size:12px" onclick="startMail()">启动轮询</button>
      <button class="btn btn-ghost" style="padding:6px 16px;font-size:12px" onclick="stopMail()">停止轮询</button>
      <button class="btn btn-primary" style="padding:6px 16px;font-size:12px" onclick="runMailOnce()">立即执行</button>
    </div>
  </div>

  <div class="rule-form-wrap" style="margin-bottom:16px">
    <div class="rfw-head"><h3><svg style="width:18px;height:18px"><use href="#i-mail"/></svg> 邮箱配置</h3></div>

    <div class="rule-form-group" style="display:flex;align-items:center;gap:8px">
      <input type="checkbox" id="mailEnabled" style="width:18px;height:18px">
      <label class="rule-form-label" style="margin:0" for="mailEnabled">启用邮件自动读取（保存后自动开始轮询）</label>
    </div>

    <div class="rule-form-group"><label class="rule-form-label">邮箱地址</label>
      <input type="text" class="rule-form-input" id="mailEmail" placeholder="your_account@126.com"></div>

    <div class="rule-form-group"><label class="rule-form-label">客户端授权码</label>
      <input type="password" class="rule-form-input" id="mailAuthCode" placeholder="126 邮箱的客户端授权码（非登录密码）"></div>

    <div class="rule-form-group"><label class="rule-form-label">主题关键词（逗号分隔，任一命中即处理）</label>
      <input type="text" class="rule-form-input" id="mailKeywords" placeholder="总表, 月报"></div>

    <div class="rule-form-group"><label class="rule-form-label">筛选省份（逗号分隔，留空 = 全量合并）</label>
      <input type="text" class="rule-form-input" id="mailProvinces" placeholder="湖南省, 江苏省"></div>

    <div style="display:flex;gap:16px">
      <div class="rule-form-group" style="flex:1"><label class="rule-form-label">处理日期（留空 = 今天）</label>
        <input type="date" class="rule-form-input" id="mailDate"></div>
      <div class="rule-form-group" style="flex:1"><label class="rule-form-label">轮询间隔（秒）</label>
        <input type="number" class="rule-form-input" id="mailInterval" value="3600"></div>
    </div>

    <div style="display:flex;gap:10px;margin-top:20px">
      <button class="btn btn-primary" style="flex:1" onclick="saveMailConfig()">保存配置</button>
    </div>
  </div>

  <div class="card card-pad" style="margin-top:16px;text-align:center">
    <a class="btn btn-primary" href="/mail/results" style="text-decoration:none">查看处理结果 →</a>
  </div>

</div>

<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <symbol id="i-upload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></symbol>
  <symbol id="i-chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></symbol>
  <symbol id="i-log-out" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></symbol>
  <symbol id="i-mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></symbol>
</svg>

<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-box">
    <div class="spinner"></div>
    <p id="loadingText">正在处理中...</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
function esc(s){if(s===null||s===undefined)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function toast(msg,type){const t=document.getElementById('toast');const icon=type==='error'?'<svg><use href="#i-alert"/></svg>':'<svg><use href="#i-check"/></svg>';t.innerHTML=icon+msg;t.className='toast show '+(type||'success');setTimeout(()=>t.classList.remove('show'),3000)}
function showLoading(text){document.getElementById('loadingText').textContent=text||'处理中...';document.getElementById('loadingOverlay').classList.add('show')}
function hideLoading(){document.getElementById('loadingOverlay').classList.remove('show')}

function updateMailStatus(running){
  document.getElementById('mailStatusRunning').classList.toggle('badge-hidden',!running);
  document.getElementById('mailStatusStopped').classList.toggle('badge-hidden',running);
}
async function loadMailConfig(){
  try{
    const resp=await fetch('/api/mail/config');
    const data=await resp.json();
    if(data.status==='success'){
      const cfg=data.config||{};
      document.getElementById('mailEnabled').checked=!!cfg.enabled;
      document.getElementById('mailEmail').value=cfg.email||'';
      document.getElementById('mailAuthCode').value=cfg.auth_code||'';
      document.getElementById('mailKeywords').value=(cfg.subject_keywords||[]).join(', ');
      document.getElementById('mailProvinces').value=(cfg.provinces||[]).join(', ');
      document.getElementById('mailInterval').value=cfg.poll_interval_seconds||3600;
      document.getElementById('mailDate').value=cfg.date||'';
      updateMailStatus(data.running);
    }
  }catch(e){toast('加载邮件配置失败','error')}
}
async function saveMailConfig(){
  const cfg={
    enabled:document.getElementById('mailEnabled').checked,
    imap_host:'imap.126.com',
    email:document.getElementById('mailEmail').value.trim(),
    auth_code:document.getElementById('mailAuthCode').value.trim(),
    subject_keywords:document.getElementById('mailKeywords').value.split(',').map(s=>s.trim()).filter(Boolean),
    provinces:document.getElementById('mailProvinces').value.split(',').map(s=>s.trim()).filter(Boolean),
    poll_interval_seconds:parseInt(document.getElementById('mailInterval').value)||3600,
    date:document.getElementById('mailDate').value,
    output_dir:'output',
    output_prefix:'邮件合并',
    processed_uids_file:'data/processed_uids.json',
  };
  showLoading('正在保存配置...');
  try{
    const resp=await fetch('/api/mail/config',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(cfg)});
    const data=await resp.json();
    if(data.status==='success'){
      updateMailStatus(data.running);
      toast(cfg.enabled?'配置已保存，已启动轮询':'配置已保存，已停止轮询');
    }else{toast('保存失败: '+(data.detail||'未知错误'),'error')}
  }catch(e){toast('请求出错: '+e.message,'error')}
  finally{hideLoading()}
}
async function startMail(){
  showLoading('正在启动...');
  try{
    const resp=await fetch('/api/mail/start',{method:'POST'});
    const data=await resp.json();
    updateMailStatus(data.running);
    toast(data.running?'已启动轮询':'启动失败');
  }catch(e){toast('请求出错: '+e.message,'error')}
  finally{hideLoading()}
}
async function stopMail(){
  showLoading('正在停止...');
  try{
    const resp=await fetch('/api/mail/stop',{method:'POST'});
    const data=await resp.json();
    updateMailStatus(data.running);
    toast('已停止轮询');
  }catch(e){toast('请求出错: '+e.message,'error')}
  finally{hideLoading()}
}
async function runMailOnce(){
  showLoading('正在立即执行，可能需要几十秒...');
  try{
    const resp=await fetch('/api/mail/run',{method:'POST'});
    const data=await resp.json();
    if(data.status==='success'){
      toast('立即执行完成，处理 '+data.handled+' 封邮件');
      window.location.href='/mail/results';
    }else{toast('执行失败: '+(data.detail||'未知错误'),'error')}
  }catch(e){toast('请求出错: '+e.message,'error')}
  finally{hideLoading()}
}
async function loadUserInfo(){
  try{
    const resp=await fetch('/api/me');
    if(!resp.ok){window.location.href='/login';return}
    const data=await resp.json();
    if(data.status==='success'&&data.user){
      const u=data.user;
      document.getElementById('userName').textContent=u.name||u.username;
      document.getElementById('userRole').textContent=u.role==='admin'?'管理员':'普通用户';
      document.getElementById('userAvatar').textContent=(u.name||u.username||'?')[0].toUpperCase();
      document.getElementById('userBox').style.display='flex';
    }
  }catch(e){window.location.href='/login'}
}
async function doLogout(){
  try{await fetch('/api/logout',{method:'POST'})}catch(e){}
  window.location.href='/login';
}

loadUserInfo();
loadMailConfig();
</script>
</body>
</html>
