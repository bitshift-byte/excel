<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>邮件设置 - LX捞数据</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<style>
.mail-wrap{max-width:960px;margin:0 auto;padding:24px}
.page-title{font-family:var(--font-display);font-size:20px;font-weight:700;color:var(--text);margin-bottom:16px;display:flex;align-items:center;gap:10px}
.page-title svg{width:22px;height:22px;color:var(--primary)}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="logo"><svg><use href="#i-database"/></svg></div>
      <div>
        <div class="name">LX捞数据</div>
        <div class="sub">LX捞数据</div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section">
        <div class="nav-section-title">功能</div>
        <div class="nav-item" onclick="window.location.href='/'"><svg><use href="#i-upload"/></svg> 文件合并</div>
        <div class="nav-item active" onclick="window.location.href='/mail'"><svg><use href="#i-mail"/></svg> 邮件设置</div>
        <div class="nav-item" onclick="window.location.href='/mail/results'"><svg><use href="#i-download"/></svg> 处理结果</div>
      </div>
    </nav>
    <div class="sidebar-footer">
      <div class="user-box" id="userBox" style="display:none">
        <div class="user-avatar" id="userAvatar"></div>
        <div class="user-info">
          <div class="user-name" id="userName">用户</div>
          <div class="user-role" id="userRole">角色</div>
        </div>
        <button class="btn-logout" onclick="doLogout()" title="退出登录"><svg><use href="#i-log-out"/></svg></button>
      </div>
      <div class="status"><span class="dot"></span>服务运行中</div>
    </div>
  </aside>

  <div class="main">
    <div class="mail-wrap">
      <div class="page-title"><svg><use href="#i-mail"/></svg> 邮件设置</div>

      <div class="card" style="margin-bottom:16px">
        <div class="card-head">
          <div class="ch-icon"><svg><use href="#i-mail"/></svg></div>
          <span class="ch-title">邮件配置状态</span>
          <span class="ch-sub">配置由管理员在后台统一管理</span>
          <div class="ch-spacer"></div>
          <span id="mailStatusBadge" class="badge" style="padding:4px 12px;border-radius:999px;font-size:12px"></span>
        </div>
        <div class="card-pad" id="mailConfigDisplay" style="padding:16px 20px">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
            <div>
              <div style="font-size:12px;color:var(--text-4);margin-bottom:4px">邮箱地址</div>
              <div id="cfgEmail" style="font-size:14px;color:var(--text-2);font-weight:600">-</div>
            </div>
            <div>
              <div style="font-size:12px;color:var(--text-4);margin-bottom:4px">IMAP服务器</div>
              <div id="cfgImap" style="font-size:14px;color:var(--text-2);font-weight:600">-</div>
            </div>
            <div>
              <div style="font-size:12px;color:var(--text-4);margin-bottom:4px">主题关键词</div>
              <div id="cfgKeywords" style="font-size:14px;color:var(--text-2);font-weight:600">-</div>
            </div>
            <div>
              <div style="font-size:12px;color:var(--text-4);margin-bottom:4px">筛选省份</div>
              <div id="cfgProvinces" style="font-size:14px;color:var(--text-2);font-weight:600">-</div>
            </div>
            <div>
              <div style="font-size:12px;color:var(--text-4);margin-bottom:4px">轮询间隔</div>
              <div id="cfgInterval" style="font-size:14px;color:var(--text-2);font-weight:600">-</div>
            </div>
          </div>
        </div>
      </div>

      <div class="card admin-only" style="margin-bottom:16px">
        <div class="card-head">
          <div class="ch-icon"><svg><use href="#i-zap"/></svg></div>
          <span class="ch-title">手动操作</span>
        </div>
        <div class="card-pad" style="padding:16px 20px;display:flex;gap:12px;flex-wrap:wrap">
          <div style="flex:1;min-width:200px">
            <label class="rule-form-label" style="margin-bottom:6px">处理日期（留空 = 今天）</label>
            <input type="date" class="rule-form-input" id="mailDate" style="margin-bottom:0">
          </div>
          <button class="btn btn-primary" style="align-self:flex-end" onclick="runMailOnce()">立即执行一次</button>
        </div>
      </div>

      <div class="card card-pad" style="margin-top:16px;text-align:center">
        <a class="btn btn-primary" href="/mail/results" style="text-decoration:none">查看处理结果 →</a>
      </div>

      <div class="card" style="margin-top:16px" id="userMgmtCard">
        <div class="card-head">
          <div class="ch-icon"><svg><use href="#i-mail"/></svg></div>
          <span class="ch-title">账号管理</span>
          <span class="ch-sub">用户列表（仅管理员可见）</span>
          <div class="ch-spacer"></div>
          <button class="btn btn-ghost" style="padding:5px 12px;font-size:12px" onclick="loadUsers()">刷新</button>
        </div>
        <div class="card-pad" style="padding-top:12px">
          <div id="userList"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <symbol id="i-database" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></symbol>
  <symbol id="i-log-out" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></symbol>
  <symbol id="i-mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></symbol>
</svg>

<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-box">
    <div class="spinner"></div>
    <p id="loadingText">正在处理中...</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
function esc(s){if(s===null||s===undefined)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function toast(msg,type){const t=document.getElementById('toast');const icon=type==='error'?'<svg><use href="#i-alert"/></svg>':'<svg><use href="#i-check"/></svg>';t.innerHTML=icon+msg;t.className='toast show '+(type||'success');setTimeout(()=>t.classList.remove('show'),3000)}
function showLoading(text){document.getElementById('loadingText').textContent=text||'处理中...';document.getElementById('loadingOverlay').classList.add('show')}
function hideLoading(){document.getElementById('loadingOverlay').classList.remove('show')}

async function loadMailConfig(){
  try{
    const data=await apiFetch('/api/mail/config');
    if(data.status==='success'){
      const cfg=data.config||{};
      document.getElementById('cfgEmail').textContent=cfg.email||'未配置';
      document.getElementById('cfgImap').textContent=cfg.imap_host||'-';
      document.getElementById('cfgKeywords').textContent=(cfg.subject_keywords||[]).join('、')||'无';
      document.getElementById('cfgProvinces').textContent=(cfg.provinces||[]).join('、')||'全量';
      document.getElementById('cfgInterval').textContent=(cfg.poll_interval_seconds||3600)+' 秒';
      document.getElementById('mailDate').value=cfg.date||'';
      // Status badge
      const badge=document.getElementById('mailStatusBadge');
      if(data.running){
        badge.textContent='运行中';
        badge.style.background='var(--accent-bg)';badge.style.color='var(--accent-d)';
      }else if(cfg.enabled){
        badge.textContent='已启用（未运行）';
        badge.style.background='var(--amber-bg)';badge.style.color='var(--amber)';
      }else{
        badge.textContent='未启用';
        badge.style.background='var(--muted)';badge.style.color='var(--text-4)';
      }
    }
  }catch(e){
    console.error('mail config error:',e);
    // 不弹错误提示，静默显示"未配置"状态
    document.getElementById('cfgEmail').textContent='未配置';
    document.getElementById('cfgImap').textContent='-';
    document.getElementById('cfgKeywords').textContent='-';
    document.getElementById('cfgProvinces').textContent='-';
    document.getElementById('cfgInterval').textContent='-';
    const badge=document.getElementById('mailStatusBadge');
    badge.textContent='未配置';
    badge.style.background='var(--muted)';badge.style.color='var(--text-4)';
  }
}
async function apiFetch(url, opts){
  const resp=await fetch(url, opts);
  if(!resp.ok){
    let detail='HTTP '+resp.status;
    try{const e=await resp.json();detail=e.detail||detail}catch(_){}
    return {status:'error', detail:detail};
  }
  return await resp.json();
}
async function runMailOnce(){
  const date=document.getElementById('mailDate').value;
  showLoading('正在执行邮件处理...');
  try{
    const data=await apiFetch('/api/mail/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({date:date})});
    if(data.status==='success'){
      toast('处理完成，处理了 '+data.handled+' 封邮件');
    }else{toast('处理失败: '+(data.detail||'未知错误'),'error')}
  }catch(e){toast('请求出错: '+e.message,'error')}
  finally{hideLoading()}
}
async function loadUsers(){
  try{
    const data=await apiFetch('/api/users');
    if(data.status==='error'&&data.detail&&data.detail.includes('管理员')){document.getElementById('userMgmtCard').style.display='none';return}
    if(data.status==='success'){
      document.getElementById('userMgmtCard').style.display='block';
      const users=data.users||[];
      const el=document.getElementById('userList');
      el.innerHTML=users.map(u=>{
        return '<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border-l)">'+
          '<div style="flex:1;min-width:0">'+
          '<div style="font-size:13px;color:var(--text-2);font-weight:600">'+esc(u.name)+'（'+esc(u.username)+'）</div>'+
          '<div style="font-size:11px;color:var(--text-4)">'+(u.role==='admin'?'管理员':'用户')+'</div></div>'+
          '</div>';
      }).join('');
    }
  }catch(e){}
}
async function loadUserInfo(){
  try{
    const resp=await fetch('/api/me');
    if(!resp.ok){window.location.href='/login';return}
    const data=await resp.json();
    if(data.status==='success'&&data.user){
      const u=data.user;
      document.getElementById('userName').textContent=u.name||u.username;
      document.getElementById('userRole').textContent=u.role==='admin'?'管理员':'普通用户';
      document.getElementById('userAvatar').textContent=(u.name||u.username||'?')[0].toUpperCase();
      document.getElementById('userBox').style.display='flex';
      if(u.role!=='admin'){document.querySelectorAll('.admin-only').forEach(function(el){el.style.display='none'})}
    }
  }catch(e){window.location.href='/login'}
}
async function doLogout(){
  try{await fetch('/api/logout',{method:'POST'})}catch(e){}
  window.location.href='/login';
}

loadUserInfo();
loadMailConfig();
loadUsers();
</script>
</body>
</html>
