name: Build & Release macOS App

on:
  push:
    tags:
      - "mac-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 v1.0.1）"
        required: true
        default: "v1.0.1"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 确定版本号
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            # 去掉 mac- 前缀
            TAG="${GITHUB_REF#refs/tags/}"
            TAG="${TAG#mac-}"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          fi

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 更新版本号
        shell: python
        run: |
          import re
          tag = "${{ steps.ver.outputs.tag }}"
          with open("updater.py", "r", encoding="utf-8") as f:
              t = f.read()
          t = re.sub(r'APP_VERSION = "v[^"]*"', f'APP_VERSION = "{tag}"', t)
          with open("updater.py", "w", encoding="utf-8") as f:
              f.write(t)
          print(f"Version set to: {tag}")

      - name: PyInstaller 打包 macOS .app
        run: |
          pyinstaller --noconfirm --clean --windowed --name LX --icon icon.icns --collect-all webview --hidden-import updater --add-data "china_regions.json:." --add-data "templates:templates" --add-data "auth_config.example.json:." app.py

      - name: 修复 macOS 签名和权限
        run: |
          # macOS 代码签名必须从内向外：先签名所有 .so/.dylib/可执行文件
          find dist/LX.app -type f \( -name "*.so" -o -name "*.dylib" \) | while read f; do
            codesign --force --sign - "$f" 2>/dev/null || true
          done
          # 签名所有可执行文件
          find dist/LX.app -type f -perm /111 | while read f; do
            codesign --force --sign - "$f" 2>/dev/null || true
          done
          # 签名嵌套的 framework（从内向外）
          find dist/LX.app -name "*.framework" -type d | sort -r | while read fw; do
            codesign --force --sign - "$fw" 2>/dev/null || true
          done
          # 最后签名整个 .app bundle（--deep 会递归验证嵌套签名）
          codesign --force --deep --sign - "dist/LX.app" 2>/dev/null || true
          # 验证签名
          codesign --verify --deep --strict "dist/LX.app" 2>&1 || echo "签名验证有警告（不影响运行）"
          # 移除隔离属性
          xattr -cr dist/LX.app 2>/dev/null || true
          # 确保可执行文件有执行权限
          chmod +x "dist/LX.app/Contents/MacOS/LX" 2>/dev/null || true
          # 设置 Info.plist 版本号
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.ver.outputs.tag }}" "dist/LX.app/Contents/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ steps.ver.outputs.tag }}" "dist/LX.app/Contents/Info.plist" 2>/dev/null || true

      - name: 打包为 zip（使用 ditto 保留元数据）
        run: |
          cd dist
          # 使用 ditto 而不是 zip，ditto 不会添加 com.apple.provenance 属性
          ditto -c -k --keepParent "LX.app" "LX捞数据-macOS-${{ steps.ver.outputs.tag }}.zip"

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: LX捞数据-macOS
          path: dist/LX捞数据-macOS-${{ steps.ver.outputs.tag }}.zip
          retention-days: 30

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/LX捞数据-macOS-${{ steps.ver.outputs.tag }}.zip
          tag_name: mac-${{ steps.ver.outputs.tag }}
          name: LX捞数据 macOS ${{ steps.ver.outputs.tag }}
          body: |
            ## LX捞数据 macOS ${{ steps.ver.outputs.tag }}

            ### 下载使用
            1. 下载 `LX捞数据-macOS-${{ steps.ver.outputs.tag }}.zip`
            2. 解压后得到 `LX.app`
            3. 双击运行（首次运行可能需要在系统设置→隐私与安全性中允许运行）

            ### 注意事项
            - 此版本为 macOS (Apple Silicon) 版本
            - 自动升级功能支持 macOS
            - 首次打开如果提示"无法验证开发者"或"无法打开"：
              1. 打开终端（Terminal）
              2. 执行: xattr -cr /path/to/LX.app （把路径替换为实际解压路径）
              3. 再双击 LX.app 即可打开
            - 或者右键点击 LX.app → 选择"打开" → 点击"打开"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传到云端服务器（自动发版）
        continue-on-error: true
        env:
          SERVICE_TOKEN: ${{ secrets.SERVICE_TOKEN }}
          SERVER_URL: ${{ secrets.SERVER_URL }}
        run: |
          DEFAULT_URL="http://18.177.82.156:8001"
          SERVER="${SERVER_URL:-$DEFAULT_URL}"
          if [ -z "$SERVICE_TOKEN" ]; then
            echo "⚠ SERVICE_TOKEN secret 未配置，跳过云端上传"
            exit 0
          fi
          FILE="dist/LX捞数据-macOS-${{ steps.ver.outputs.tag }}.zip"
          echo ">>> 上传 $FILE 到 $SERVER/api/upload-update ..."
          HTTP_CODE=$(curl -s -o upload_resp.txt -w "%{http_code}" \
            -X POST "$SERVER/api/upload-update" \
            -H "X-Service-Token: $SERVICE_TOKEN" \
            -F "version=${{ steps.ver.outputs.tag }}" \
            -F "platform=macos" \
            -F "notes=GitHub Actions 自动构建 ${{ steps.ver.outputs.tag }}" \
            -F "file=@$FILE")
          echo "HTTP $HTTP_CODE"
          cat upload_resp.txt
          echo ""
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✓ 云端发版成功"
          else
            echo "✗ 云端发版失败（HTTP $HTTP_CODE），但不阻塞 Release"
          fi
