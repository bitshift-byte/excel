name: Build & Release macOS App

on:
  push:
    tags:
      - "mac-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 v1.0.1）"
        required: true
        default: "v1.0.1"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 确定版本号
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            # 去掉 mac- 前缀
            TAG="${GITHUB_REF#refs/tags/}"
            TAG="${TAG#mac-}"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          fi

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 更新版本号
        shell: python
        run: |
          import re
          tag = "${{ steps.ver.outputs.tag }}"
          with open("updater.py", "r", encoding="utf-8") as f:
              t = f.read()
          t = re.sub(r'APP_VERSION = "v[^"]*"', f'APP_VERSION = "{tag}"', t)
          with open("updater.py", "w", encoding="utf-8") as f:
              f.write(t)
          print(f"Version set to: {tag}")

      - name: PyInstaller 打包 macOS .app
        run: |
          pyinstaller --noconfirm --clean --windowed --name LX --icon icon.icns --collect-all webview --hidden-import updater --add-data "china_regions.json:." --add-data "templates:templates" --add-data "auth_config.example.json:." app.py

      - name: 修复 macOS 签名和权限
        run: |
          # 对所有二进制文件执行 ad-hoc 签名（不签名 macOS 会拒绝运行）
          find dist/LX.app -type f -name "*.so" -o -name "*.dylib" -o -type f -perm /111 | while read f; do
            codesign --force --sign - "$f" 2>/dev/null || true
          done
          # 对主可执行文件签名
          codesign --force --deep --sign - "dist/LX.app" 2>/dev/null || true
          # 移除隔离属性（zip 解压后不会继承）
          xattr -cr dist/LX.app 2>/dev/null || true
          # 确保可执行文件有执行权限
          chmod +x "dist/LX.app/Contents/MacOS/LX" 2>/dev/null || true

      - name: 打包为 zip
        run: |
          cd dist
          zip -r -X "LX捞数据-macOS-${{ steps.ver.outputs.tag }}.zip" "LX.app"

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: LX捞数据-macOS
          path: dist/LX捞数据-macOS-${{ steps.ver.outputs.tag }}.zip
          retention-days: 30

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/LX捞数据-macOS-${{ steps.ver.outputs.tag }}.zip
          tag_name: mac-${{ steps.ver.outputs.tag }}
          name: LX捞数据 macOS ${{ steps.ver.outputs.tag }}
          body: |
            ## LX捞数据 macOS ${{ steps.ver.outputs.tag }}

            ### 下载使用
            1. 下载 `LX捞数据-macOS-${{ steps.ver.outputs.tag }}.zip`
            2. 解压后得到 `LX.app`
            3. 双击运行（首次运行可能需要在系统设置→隐私与安全性中允许运行）

            ### 注意事项
            - 此版本为 macOS (Apple Silicon) 版本
            - 自动升级功能支持 macOS
            - 首次打开如果提示"无法验证开发者"，请到 系统设置→隐私与安全性 点击"仍要打开"
            - 或在终端执行: xattr -cr /Applications/LX.app
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
