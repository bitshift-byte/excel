name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pywebview pyinstaller

      - name: PyInstaller 打包
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name LX --icon icon.ico --collect-all webview --add-data "china_regions.json;." --add-data "templates;templates" app.py

      - name: 重命名 exe
        run: |
          Rename-Item -Path "dist/LX.exe" -NewName "LX捞数据.exe"

      - name: 上传 exe
        uses: actions/upload-artifact@v4
        with:
          name: LX捞数据-Windows
          path: dist/LX捞数据.exe
          retention-days: 30

      - name: 删除旧 Release 和 Tag
        run: |
          gh release delete latest --yes 2>$null
          git push origin --delete latest 2>$null
          exit 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 发布到 Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/LX捞数据.exe
          tag_name: latest
          name: LX捞数据
          body: |
            LX捞数据 Windows 单文件版。
            双击运行后弹出桌面窗口（http://127.0.0.1:8000）。
            首次登录账号 admin / admin123，登录后绑定 IP。
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
