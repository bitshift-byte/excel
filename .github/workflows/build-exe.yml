name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: PyInstaller 打包
        run: |
          pyinstaller --noconfirm --clean --onefile --name ExcelMerger --add-data "china_regions.json;." --add-data "templates;templates" app.py

      - name: 上传 exe
        uses: actions/upload-artifact@v4
        with:
          name: ExcelMerger-Windows
          path: dist/ExcelMerger.exe
          retention-days: 30
