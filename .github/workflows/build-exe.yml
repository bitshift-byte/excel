name: Build & Release Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 v1.0.1）"
        required: true
        default: "v1.0.1"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 确定版本号
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 更新版本号
        shell: python
        run: |
          import re
          tag = "${{ steps.ver.outputs.tag }}"
          with open("updater.py", "r", encoding="utf-8") as f:
              t = f.read()
          t = re.sub(r'APP_VERSION = "v[^"]*"', f'APP_VERSION = "{tag}"', t)
          with open("updater.py", "w", encoding="utf-8") as f:
              f.write(t)
          print(f"Version set to: {tag}")
      - name: PyInstaller 打包
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name LX --icon icon.ico --collect-all webview --hidden-import updater --add-data "china_regions.json;." --add-data "templates;templates" --add-data "auth_config.example.json;." app.py

      - name: 重命名 exe
        run: |
          Rename-Item -Path "dist/LX.exe" -NewName "LX捞数据.exe"

      - name: 上传 exe
        uses: actions/upload-artifact@v4
        with:
          name: LX捞数据-Windows
          path: dist/LX捞数据.exe
          retention-days: 30

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/LX捞数据.exe
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          body: |
            ## LX捞数据 ${{ steps.ver.outputs.tag }}

            ### 下载使用
            1. 下载 `LX捞数据.exe`
            2. 双击运行，弹出桌面窗口
            3. 默认账号：admin / admin123

            ### 自动升级
            已安装的旧版本可在应用内点击右下角刷新图标自动检查并升级。
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
