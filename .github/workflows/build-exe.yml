name: Build & Release Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 v1.0.1）"
        required: true
        default: "v1.0.1"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 确定版本号
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 更新版本号
        shell: python
        run: |
          import re
          tag = "${{ steps.ver.outputs.tag }}"
          with open("updater.py", "r", encoding="utf-8") as f:
              t = f.read()
          t = re.sub(r'APP_VERSION = "v[^"]*"', f'APP_VERSION = "{tag}"', t)
          with open("updater.py", "w", encoding="utf-8") as f:
              f.write(t)
          print(f"Version set to: {tag}")

      - name: PyInstaller 打包
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name LX --icon icon.ico --collect-all webview --hidden-import updater --add-data "china_regions.json;." --add-data "templates;templates" --add-data "auth_config.example.json;." app.py

      - name: 重命名 exe
        run: |
          Rename-Item -Path "dist/LX.exe" -NewName "LX捞数据-${{ steps.ver.outputs.tag }}.exe"

      - name: 上传 exe
        uses: actions/upload-artifact@v4
        with:
          name: LX捞数据-Windows
          path: dist/LX捞数据-${{ steps.ver.outputs.tag }}.exe
          retention-days: 30

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/LX捞数据-${{ steps.ver.outputs.tag }}.exe
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          body: |
            ## LX捞数据 ${{ steps.ver.outputs.tag }}

            ### 下载使用
            1. 下载 `LX捞数据-${{ steps.ver.outputs.tag }}.exe`
            2. 双击运行，弹出桌面窗口

            ### 自动升级
            已安装的旧版本可在应用内点击右下角刷新图标自动检查并升级。
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传到云端服务器（自动发版）
        continue-on-error: true
        env:
          SERVICE_TOKEN: ${{ secrets.SERVICE_TOKEN }}
          SERVER_URL: ${{ secrets.SERVER_URL }}
        shell: bash
        run: |
          DEFAULT_URL="http://18.177.82.156:8001"
          SERVER="${SERVER_URL:-$DEFAULT_URL}"
          TAG="${{ steps.ver.outputs.tag }}"

          echo "=== 云端发版 ==="
          echo "版本: $TAG"
          echo "服务器: $SERVER"
          echo "SERVICE_TOKEN 长度: ${#SERVICE_TOKEN}"

          if [ -z "$SERVICE_TOKEN" ]; then
            echo "❌ SERVICE_TOKEN secret 未配置！"
            echo "请在 GitHub 仓库 Settings → Secrets → Actions 中添加 SERVICE_TOKEN"
            exit 0
          fi

          # 复制为 ASCII 文件名，避免中文编码问题
          SRC_FILE="dist/LX捞数据-${TAG}.exe"
          UPLOAD_FILE="dist/LX-Windows-${TAG}.exe"
          cp "$SRC_FILE" "$UPLOAD_FILE"

          echo ">>> 上传 $UPLOAD_FILE ($(wc -c < "$UPLOAD_FILE") bytes) 到 $SERVER/api/upload-update ..."

          HTTP_CODE=$(curl -s -o /tmp/upload_resp.txt -w "%{http_code}" \
            --connect-timeout 30 \
            --max-time 300 \
            -X POST "$SERVER/api/upload-update" \
            -H "X-Service-Token: $SERVICE_TOKEN" \
            -F "version=${TAG}" \
            -F "platform=windows" \
            -F "notes=GitHub Actions CI auto build ${TAG}" \
            -F "file=@${UPLOAD_FILE}")

          echo "HTTP 响应码: $HTTP_CODE"
          echo "服务器返回:"
          cat /tmp/upload_resp.txt
          echo ""

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ 云端发版成功！桌面端可自动检查更新。"
          else
            echo "❌ 云端发版失败（HTTP $HTTP_CODE）"
          fi
