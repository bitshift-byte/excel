<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#F06595">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="LX捞数据 - Excel合并筛选系统">
  <title>LX捞数据</title>

  <!-- 预连接到字体源（不阻塞渲染） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- 字体异步加载：不阻塞首屏渲染 -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Quicksand:wght@500;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Quicksand:wght@500;700&display=swap"></noscript>

  <style>
    /* 内联关键 CSS：首屏在 JS 加载前即可渲染 */
    :root {
      --primary: #F06595; --primary-d: #D6336C; --bg: #FDF6F0;
      --text: #3D2B3C; --text-2: #5C4555; --text-4: #8B7689;
      --glass-bg: rgba(255,255,255,.72); --glass-blur: blur(16px);
      --r-xl: 24px; --r-sm: 10px; --r-pill: 999px;
      --ease-spring: cubic-bezier(.22,1,.36,1);
      --shadow-xl: 0 20px 48px -10px rgba(240,101,149,.22), 0 8px 20px -6px rgba(61,43,60,.08);
      --font-display: 'Quicksand', -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
      --font-body: 'Nunito', -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
    /* 首屏骨架：在 Vue 挂载前显示，避免白屏 */
    #app:empty::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 50% 40%, rgba(240,101,149,0.05), transparent),
        var(--bg);
    }
    #app:empty::after {
      content: '';
      position: fixed;
      top: 50%; left: 50%;
      width: 32px; height: 32px;
      margin: -16px 0 0 -16px;
      border: 3px solid rgba(240,101,149,0.15);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: app-spin .7s linear infinite;
    }
    @keyframes app-spin {
      to { transform: rotate(360deg); }
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #160F1C; --text: #F5E8EF;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
